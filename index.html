  try { return (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audiooutput'); }
  catch { return []; }
}
// A short 440 Hz beep (as a WAV blob) played through the selected output so the operator can confirm the routing.
function playTestTone() {
  const rate = 8000, n = rate / 2, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
  const w = (o, str) => [...str].forEach((c, i) => { b[o + i] = c.charCodeAt(0); });
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b[44 + i] = 128 + Math.round(70 * Math.sin(2 * Math.PI * 440 * i / rate) * Math.min(1, i / 400, (n - i) / 400));
  const url = URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
  const a = new Audio(url);
  a.volume = 0.4;
  a.addEventListener('ended', () => URL.revokeObjectURL(url));
  applyOutputTo(a).then(() => a.play()).catch(() => setStatus('Could not play the test tone'));
}

// ── Fade engine ───────────────────────────────────────────
const FADE_STEP_MS = 30;

function startFade(id, targetVol, durationSec, onComplete) {
  clearFadeTimer(id);
  const pad = pads[id];
  if (!pad?.audio) { onComplete?.(); return; }
  durationSec = Number(durationSec);
  // A fade-in tracks the live pad/master volume so dragging a slider mid-fade isn't undone when it ends.
  const target = () => targetVol === 0 ? 0 : clamp01(pad.vol * masterVol);
  if (!(durationSec > 0) || !Number.isFinite(durationSec)) {
    pad.audio.volume = target();
    onComplete?.();
    return;
  }
  const startVol = pad.audio.volume;
  // Measure elapsed time rather than counting ticks: timers stall while the main
  // thread is busy, and a stretched crossfade leaves the old cue playing too long.
  const t0 = performance.now();

  if (targetVol === 0) document.getElementById(`pad${id}`)?.classList.add('fading');

  fadeTimers[id] = setInterval(() => {
    const t = Math.min((performance.now() - t0) / (durationSec * 1000), 1);
    if (pad.audio) pad.audio.volume = clamp01(startVol + (target() - startVol) * t);
    if (t >= 1) {
      clearFadeTimer(id);
      if (pad.audio) pad.audio.volume = target();
      onComplete?.();
    }
  }, FADE_STEP_MS);
}

function clearFadeTimer(id) {
  if (fadeTimers[id]) {
    clearInterval(fadeTimers[id]);
    delete fadeTimers[id];
    document.getElementById(`pad${id}`)?.classList.remove('fading');
  }
}

// ── Playback ──────────────────────────────────────────────
function playPad(id, withFade = false) {
  const pad = pads[id];
  if (!pad.audio) return;
  clearFadeTimer(id);
  const resuming   = pad.paused;
  const targetVol  = pad.vol * masterVol;
  if (!resuming) pad.audio.currentTime = pad.inPoint ?? 0;
  const useFade = !resuming && (withFade || pad.fadeEnabled);
  pad.audio.volume = useFade ? 0 : clamp01(targetVol);
  const audio = pad.audio;
  audio.play().catch(err => {
    if (err.name === 'AbortError') return;                 // superseded by a newer play/pause — not a failure
    if (pad.audio !== audio || !pad.playing) return;
    clearFadeTimer(id);
    pad.playing  = false;
    pad.paused   = false;
    pad.stopping = false;
    refreshPad(id);
    updatePlayCueBtn();
    setStatus(err.name === 'NotAllowedError'
      ? `"${pad.name}" blocked by the browser — tap the screen once, then try again`
      : `Cannot play "${pad.name}" — the audio file is unsupported or unreadable`);
  });
  pad.playing  = true;
  pad.paused   = false;
  pad.stopping = false;
  refreshPad(id);
  setStatus(resuming ? `Resumed "${pad.name}"` : `Playing "${pad.name}"`);
  if (useFade) startFade(id, targetVol, fadeDuration);
}

function pausePad(id) {
  const pad = pads[id];
  if (!pad.audio || !pad.playing) return;
  clearFadeTimer(id);
  pad.audio.pause();
  pad.playing  = false;
  pad.paused   = true;
  pad.stopping = false;
  refreshPad(id);
  setStatus(`"${pad.name}" paused`);
}

function stopPad(id, withFade = false) {
  const pad = pads[id];
  if (!pad.audio) return;
  if (withFade) {
    // Already fading out: let that fade finish — restarting it would stretch the fade and delay silence
    if (pad.stopping) return;
    pad.stopping = true;
    startFade(id, 0, fadeDuration, () => {
      if (pad.audio) {
        pad.audio.pause();
        pad.audio.currentTime = 0;
        pad.audio.volume = clamp01(pad.vol * masterVol);
      }
      pad.playing  = false;
      pad.paused   = false;
      pad.stopping = false;
      refreshPad(id);
      updatePlayCueBtn();
    });
  } else {
    clearFadeTimer(id);
    pad.audio.pause();
    pad.audio.currentTime = 0;
    pad.playing  = false;
    pad.paused   = false;
    pad.stopping = false;
    refreshPad(id);
    updatePlayCueBtn();
  }
}

// A pad that is fading out can be brought back (operator hit the wrong key): fade it up again
// from wherever the fade got to, without restarting the sound.
function reviveStopping(id) {
  const pad = pads[id];
  pad.stopping = false;
  startFade(id, 1, fadeDuration);      // any non-zero target = "up to the live pad × master level"
  refreshPad(id);
  setStatus(`"${pad.name}" brought back`);
}

// Pad click: play/pause this pad, fade out any other playing pad
function togglePad(id) {
  const pad = pads[id];
  if (pad.playing && pad.stopping) {
    reviveStopping(id);
  } else if (pad.playing) {
    pausePad(id);
  } else {
    pads.forEach(p => { if (p.id !== id && p.playing) stopPad(p.id, true); });
    playPad(id);
  }
}

// Keyboard / shortcut: always crossfade (fade out others, fade in this)
function togglePadCrossfade(id) {
  const pad = pads[id];
  if (!pad.file) return;
  if (pad.playing && pad.stopping) {
    pads.forEach(p => { if (p.id !== id && p.playing) stopPad(p.id, true); });
    reviveStopping(id);
  } else if (pad.playing) {
    stopPad(id, true);
  } else {
    pads.forEach(p => { if (p.id !== id && p.playing) stopPad(p.id, true); });
    playPad(id, true);
  }
}

// mode 'auto' (STOP ALL button): follows the STOP FADE toggle. mode 'cut' (Escape / panic): always instant.
// With STOP FADE on, pressing it again while pads are still fading out hard-cuts them — there is always a way out.
function stopAll(mode = 'auto') {
  clearTimeout(advTimer);   // a pending auto-advance must not start a cue after STOP ALL
  const fade = mode === 'auto' && prefs.stopFade;
  let n = 0;
  pads.forEach(p => {
    if (!p.playing) return;
    n++;
    stopPad(p.id, fade && !p.stopping);
  });
  setStatus(n ? (fade ? 'Fading out… press again to cut' : 'All stopped') : 'Nothing is playing');
  updatePlayCueBtn();
}

function toggleStopFade() {
  prefs.stopFade = !prefs.stopFade;
  savePrefs();
  refreshStopFadeBtn();
  setStatus(prefs.stopFade ? `STOP FADE on — STOP ALL fades out over ${fadeDuration}s` : 'STOP FADE off — STOP ALL cuts instantly');
}
function refreshStopFadeBtn() {
  const b = document.getElementById('stopFadeBtn');
  if (!b) return;
  b.classList.toggle('on', prefs.stopFade);
  b.setAttribute('aria-pressed', prefs.stopFade ? 'true' : 'false');
}

function setMasterVolume(v) {
  masterVol = clamp01(v);
  pads.forEach(p => { if (p.audio && !fadeTimers[p.id]) p.audio.volume = clamp01(p.vol * masterVol); });
  scheduleAutosave();
}

function setPadVolume(id, v) {
  pads[id].vol = clamp01(v);
  if (pads[id].audio && !fadeTimers[id]) pads[id].audio.volume = clamp01(pads[id].vol * masterVol);
  const pct = document.getElementById(`pvol-pct-${id}`);
  if (pct) pct.textContent = Math.round(pads[id].vol * 100) + '%';
  scheduleAutosave();
}

function toggleFadeEnabled(id) {
  pads[id].fadeEnabled = !pads[id].fadeEnabled;
  refreshPad(id);
  scheduleAutosave();
}

function setInPoint(id) {
  if (lockedOut()) return;
  const pad = pads[id];
  if (!pad.audio) return;
  if (pad.inPoint !== null) {
    pad.inPoint = null;
    setStatus('IN point cleared');
  } else {
    pad.inPoint = pad.audio.currentTime;
    if (pad.outPoint !== null && pad.inPoint >= pad.outPoint) pad.outPoint = null;
    setStatus(`IN point set at ${fmt(pad.inPoint)}`);
  }
  syncLoopFlag(pad);
  refreshPad(id);
  scheduleAutosave();
}

function setOutPoint(id) {
  if (lockedOut()) return;
  const pad = pads[id];
  if (!pad.audio) return;
  if (pad.outPoint !== null) {
    pad.outPoint = null;
    setStatus('OUT point cleared');
  } else {
    pad.outPoint = pad.audio.currentTime;
    if (pad.inPoint !== null && pad.outPoint <= pad.inPoint) pad.inPoint = null;
    setStatus(`OUT point set at ${fmt(pad.outPoint)}`);
  }
  syncLoopFlag(pad);
  refreshPad(id);
  scheduleAutosave();
}

function toggleLoop(id) {
  const pad = pads[id];
  pad.loop = !pad.loop;
  syncLoopFlag(pad);
  refreshPad(id);
  scheduleAutosave();
}

// ── Color picker ──────────────────────────────────────────
function openColorPicker(id) {
  if (lockedOut()) return;
  const inp = document.createElement('input');
  inp.type = 'color';
  inp.value = pads[id].color;
  inp.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:0;height:0;';
  document.body.appendChild(inp);
  inp.addEventListener('input',  () => { pads[id].color = inp.value; refreshPad(id); });
  inp.addEventListener('change', () => { pads[id].color = inp.value; refreshPad(id); document.body.removeChild(inp); scheduleAutosave(); });
  inp.addEventListener('cancel', () => { try { document.body.removeChild(inp); } catch {} });
  inp.click();
}

// ── File loading ──────────────────────────────────────────
// Audio-file test used everywhere files come in (browse, drop, fill). Extension OR MIME type: iOS often reports an empty type.
const AUDIO_FILE_EXT = /\.(wav|mp3|ogg|oga|flac|aac|m4a|m4b|aif|aiff|aifc|opus|webm|mp4|mka|caf)$/i;
function isAudioFile(f) {
  const t = (f?.type || '').toLowerCase();
  return AUDIO_FILE_EXT.test(f?.name || '') || t.startsWith('audio/') || t === 'video/mp4' || t === 'video/webm' || t === 'application/ogg';
}
// Natural sort, so "Cue 2" comes before "Cue 10"
function sortAudioFiles(files) {
  return [...files].filter(isAudioFile).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
}

// Load several files at once. The first goes on `startId` (or the first empty pad when null); the rest fill the next
// EMPTY pads — a loaded pad is never overwritten — and new pads are added when the grid runs out.
function fillPadsFrom(files, startId = null) {
  if (lockedOut()) return 0;
  const all  = [...files];
  const list = sortAudioFiles(all);
  if (!list.length) { setStatus(all.length ? 'None of those files are audio' : 'No files selected'); return 0; }
  const firstEmpty = () => pads.findIndex(p => !p.file);
  let id = startId ?? firstEmpty();
  let placed = 0, capped = false;
  for (const f of list) {
    if (placed > 0) {
      id = pads.findIndex((p, i) => i > id && !p.file);
    }
    if (id === -1 || id === null || id >= pads.length) {
      if (pads.length >= MAX_PADS) { capped = true; break; }
      id = pads.length;
      pads.push(normalizePad({}, id));
    }
    if (loadFile(id, f, true) !== false) placed++;
  }
  buildPads();
  const skipped = all.length - list.length;
  setStatus(`Loaded ${placed} sound(s)` + (skipped ? ` — ${skipped} non-audio file(s) skipped` : '') + (capped ? ` — stopped at ${MAX_PADS} pads` : ''));
  scheduleAutosave();
  return placed;
}

function pickFilesForPads() {
  if (lockedOut()) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*'; inp.multiple = true;
  inp.style.cssText = 'position:fixed;top:-200px;left:-200px;opacity:0;pointer-events:none;';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    if (inp.files.length) fillPadsFrom(inp.files, null);
    try { document.body.removeChild(inp); } catch {}
  });
  inp.click();
}

function browseFile(padId) {
  if (lockedOut()) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*'; inp.multiple = true;
  // Must be in DOM for iOS Safari to open the file picker
  inp.style.cssText = 'position:fixed;top:-200px;left:-200px;opacity:0;pointer-events:none;';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    if (inp.files.length > 1) fillPadsFrom(inp.files, padId);
    else if (inp.files[0]) loadFile(padId, inp.files[0]);
    try { document.body.removeChild(inp); } catch {}
  });
  inp.click();
}

function loadFile(padId, file, quiet = false) {
  if (lockedOut()) return false;
  if (!isAudioFile(file)) { setStatus(`"${file?.name ?? 'That file'}" is not an audio file`); return false; }
  const pad = pads[padId];
  if (pad.file) { const snap = snapshotPad(pad); pushUndo(`replaced the sound on pad ${padId + 1}`, () => restorePad(pads[padId], snap), pad.file.size); }
  clearFadeTimer(padId);
  attachAudio(pad, file);
  pad.filePath = file.path || null;
  pad.name    = pad.name || stripExt(file.name);
  pad.playing  = false;
  pad.paused   = false;
  pad.stopping = false;
  // IN/OUT points belong to the previous file — on a shorter one they'd cut it off or play silence
  pad.inPoint = pad.outPoint = null;
  syncLoopFlag(pad);
  refreshPad(padId);
  updatePlayCueBtn();
  if (!quiet) { setStatus(`Loaded "${pad.name}"`); scheduleAutosave(); }
  return true;
}

function attachAudio(pad, file) {
  releaseAudio(pad);                       // free the previous element and its blob URL
  const url     = URL.createObjectURL(file);
  const audio   = new Audio(url);
  applyOutputTo(audio);                    // route to the chosen output device (no-op on the system default / unsupported browsers)
  audio.loop    = pad.loop && pad.inPoint === null;
  audio.volume  = clamp01(pad.vol * masterVol);
  audio.preload = 'auto';
  audio.addEventListener('ended', () => {
    if (pad.audio !== audio) return;       // stale element from a replaced file
    if (pad.loop) {
      // Native loop is off when an IN point is set — wrap to the IN point by hand
      audio.currentTime = pad.inPoint ?? 0;
      audio.play().catch(() => {});
      return;
    }
    pad.playing  = false;
    pad.paused   = false;
    pad.stopping = false;
    refreshPad(pad.id);
    updatePlayCueBtn();
    setStatus(`"${pad.name}" finished`);
    if (autoAdv) checkAutoAdvance(pad.id);
  });
  audio.addEventListener('error', () => {
    if (pad.audio !== audio) return;
    if (pad.playing) {
      clearFadeTimer(pad.id);
      pad.playing  = false;
      pad.paused   = false;
      pad.stopping = false;
      refreshPad(pad.id);
      updatePlayCueBtn();
    }
    setStatus(`Cannot play "${pad.name}" — the audio file is unsupported or unreadable`);
  });
  pad.file        = file;
  pad.audio       = audio;
  pad.audioUrl    = url;
  pad.missingPath = null;
  pad.peaks       = null;
  queuePeaks(pad);
}

// ── Clear pad ─────────────────────────────────────────────
function clearPad(id) {
  if (lockedOut()) return;
  const pad = pads[id];
  if (!pad.file) return;
  const snap = snapshotPad(pad), stacks = snapshotStacks();
  pushUndo(pad.name ? `cleared pad ${id + 1} "${pad.name}"` : `cleared pad ${id + 1}`, () => { restorePad(pads[id], snap); restoreStacks(stacks); }, pad.file.size);
  clearFadeTimer(id);
  releaseAudio(pad);
  scenes.forEach(s => {
    const current = s.stack[s.stackIdx];               // undefined when nothing is selected
    s.stack = s.stack.filter(item => item.padId !== id);
    // Re-find the selected cue by identity so removing earlier entries can't shift the selection onto a different cue
    s.stackIdx = current && s.stack.includes(current) ? s.stack.indexOf(current) : -1;
  });
  pad.file = null; pad.filePath = null; pad.missingPath = null; pad.name = ''; pad.playing = false; pad.paused = false; pad.stopping = false; pad.peaks = null;
  pad.inPoint = pad.outPoint = null;
  refreshPad(id);
  renderStack();
  setStatus(`Pad ${id + 1} cleared`);
  scheduleAutosave();
}

// ── Cue Stack ─────────────────────────────────────────────
function addToStack(padId) {
  if (lockedOut()) return;
  const pad = pads[padId];
  if (!pad.file) return;
  getScene().stack.push({ padId });
  renderStack();
  setStatus(`"${pad.name}" added to stack (#${getScene().stack.length})`);
  scheduleAutosave();
}

function removeFromStack(i) {
  if (lockedOut()) return;
  const s = getScene();
  const stacks = snapshotStacks(), padName = pads[s.stack[i]?.padId]?.name;
  pushUndo(padName ? `removed cue ${i + 1} "${padName}" from the stack` : `removed cue ${i + 1} from the stack`, () => restoreStacks(stacks));
  s.stack.splice(i, 1);
  if (i < s.stackIdx) s.stackIdx--;                   // keep the selection on the same cue
  else if (s.stackIdx >= s.stack.length) s.stackIdx = s.stack.length - 1;
  renderStack();
  scheduleAutosave();
}

function clearStack() {
  if (lockedOut()) return;
  const s = getScene();
  if (!s.stack.length) return;
  const stacks = snapshotStacks();
  pushUndo(`cleared the stack (${s.stack.length} cue(s))`, () => restoreStacks(stacks));
  s.stack = []; s.stackIdx = -1;
  renderStack();
  setStatus('Stack cleared');
  scheduleAutosave();
}

function nextCue(auto = false) {
  clearTimeout(advTimer);
  const s = getScene();
  if (!s.stack.length) return;
  // Auto-advance stops at the end of the stack; it must never wrap round and replay the show.
  if (auto && s.stackIdx >= s.stack.length - 1) return;
  const nextIdx = (s.stackIdx + 1) % s.stack.length;
  const item    = s.stack[nextIdx];
  if (!pads[item.padId]?.audio) {
    // A cue with no audio (file missing after a load / restore) must not cut the sound that is playing.
    s.stackIdx = nextIdx;
    renderStack();
    setStatus(`Cue ${nextIdx + 1} "${pads[item.padId]?.name || 'Unnamed'}" has no audio — relink the file`);
    return;
  }
  if (s.stackIdx >= 0 && s.stack[s.stackIdx]) stopPad(s.stack[s.stackIdx].padId, true);
  s.stackIdx = nextIdx;
  playPad(item.padId, true);
  renderStack();
  updatePlayCueBtn();
}

function playStackItem(i) {
  // Clicking a stack item only selects it — use PLAY CUE to start playback
  const s = getScene();
  s.stackIdx = i;
  renderStack();
}

function playCue() {
  const s = getScene();
  if (s.stackIdx < 0 || !s.stack[s.stackIdx]) return;
  const item = s.stack[s.stackIdx];
  const pad  = pads[item.padId];
  if (!pad.audio) {
    // Check before stopping anything — otherwise the room goes silent and nothing replaces it
    setStatus(`"${pad.name || 'Unnamed'}" has no audio — relink the file`);
    return;
  }
  if (pad.playing) {
    // Already playing → stop it
    stopPad(item.padId, true);
    updatePlayCueBtn();
  } else {
    // Stop everything, then play selected cue
    pads.forEach(p => { if (p.playing) stopPad(p.id, false); });
    playPad(item.padId, true);
    updatePlayCueBtn();
  }
}

function updatePlayCueBtn() {
  const btn = document.getElementById('playCueBtn');
  if (!btn) return;
  const s = getScene();
  const hasSelection = s.stackIdx >= 0 && !!s.stack[s.stackIdx];
  btn.disabled = !hasSelection;
  if (hasSelection && pads[s.stack[s.stackIdx].padId].playing) {
    btn.textContent = '■ STOP CUE';
    btn.classList.add('is-playing');
  } else {
    btn.textContent = '▶ PLAY CUE';
    btn.classList.remove('is-playing');
  }
}

function checkAutoAdvance(finishedPadId) {
  const s = getScene();
  if (s.stackIdx < 0 || !s.stack[s.stackIdx]) return;
  if (s.stackIdx >= s.stack.length - 1) return;          // end of the stack — stop, don't loop
  if (s.stack[s.stackIdx].padId !== finishedPadId) return;
  const idx = s.stackIdx;
  clearTimeout(advTimer);
  advTimer = setTimeout(() => {
    // Only advance if the operator hasn't moved the stack (or changed scene) in the meantime
    if (getScene() === s && s.stackIdx === idx) nextCue(true);
  }, 250);
}

function toggleAutoAdvance() {
  autoAdv = !autoAdv;
  document.getElementById('autoToggle').className = `toggle-sw${autoAdv ? ' on' : ''}`;
  scheduleAutosave();
}

function fmtRem(secs) { return fmt(Math.ceil(Math.max(0, secs))); }

// Text for a stack row's time cell: total length when idle, "−remaining" while the pad is playing/paused, ⟳ when looping
function stackTimeText(pad) {
  const dur = pad.audio?.duration;
  if (!pad.audio) return '⚠';
  if (!Number.isFinite(dur) || !dur) return '';
  if (pad.playing || pad.paused) {
    if (pad.loop && pad.outPoint === null) return '⟳';
    return '−' + fmtRem((pad.outPoint ?? dur) - pad.audio.currentTime);
  }
  return fmt(dur);
}

function renderStack() {
  const s    = getScene();
  const list = document.getElementById('stackList');
  const btn  = document.getElementById('nextBtn');
  btn.disabled = !s.stack.length;
  if (!s.stack.length) {
    list.innerHTML = '<div class="stack-empty">Use “+ Stack” on any loaded pad (or drag a pad\'s name here) to build your cue sequence.</div>';
    updatePlayCueBtn();
    return;
  }
  list.innerHTML = s.stack.map((item, i) => {
    const pad     = pads[item.padId];
    const active  = i === s.stackIdx;
    const noAudio = !pad.audio;
    return `<div class="stack-item${active ? ' active' : ''}${noAudio ? ' no-audio' : ''}" data-i="${i}" draggable="${IS_TOUCH ? 'false' : 'true'}" onclick="playStackItem(${i})"
         ${noAudio ? 'title="No audio loaded for this cue — relink the file"' : ''}>
      <span class="stack-n">${i + 1}</span>
      <div class="stack-dot" style="background:${pad.color}"></div>
      <span class="stack-lbl"${pad.name ? ' data-notr' : ''}>${escHtml(pad.name || 'Unnamed')}</span>
      <span class="stack-time" data-pad="${item.padId}">${stackTimeText(pad)}</span>
      <span class="stack-mv" onclick="event.stopPropagation();moveStackItem(${i},-1)" title="Move up">▲</span>
      <span class="stack-mv" onclick="event.stopPropagation();moveStackItem(${i},1)" title="Move down">▼</span>
      <span class="stack-rm" onclick="event.stopPropagation();removeFromStack(${i})">×</span>
    </div>`;
  }).join('');
  updatePlayCueBtn();
}

// Move a cue; the selection follows the cue it was on (tracked by identity, not index).
function moveStackItemTo(from, to) {
  if (lockedOut()) return;
  const s = getScene();
  if (from === to || from < 0 || to < 0 || from >= s.stack.length || to >= s.stack.length) return;
  const selected = s.stack[s.stackIdx];
  const stacksBefore = snapshotStacks();
  pushUndo('reordered the stack', () => restoreStacks(stacksBefore));
  const [item] = s.stack.splice(from, 1);
  s.stack.splice(to, 0, item);
  s.stackIdx = selected ? s.stack.indexOf(selected) : -1;
  renderStack();
  scheduleAutosave();
}
function moveStackItem(i, dir) { moveStackItemTo(i, i + dir); }

// Insert a pad into the stack at a position (drag a pad's name onto the list)
function insertPadIntoStack(padId, at) {
  if (lockedOut()) return;
  const pad = pads[padId];
  const s   = getScene();
  if (!pad?.file) return;
  const selected = s.stack[s.stackIdx];
  const pos = Math.min(Math.max(at, 0), s.stack.length);
  s.stack.splice(pos, 0, { padId });
  s.stackIdx = selected ? s.stack.indexOf(selected) : -1;
  renderStack();
  setStatus(`"${pad.name}" added to stack (#${pos + 1})`);
  scheduleAutosave();
}

// Drag & drop on the stack list (event delegation, bound once): reorder rows, or drop a pad name in.
const DND_STACK = 'text/x-kcue-stack', DND_PAD = 'text/x-kcue-pad';
function stackDropIndex(e) {
  const rows = [...document.querySelectorAll('#stackList .stack-item')];
  for (const row of rows) {
    const r = row.getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) return { idx: +row.dataset.i, row, before: true };
    if (e.clientY < r.bottom)             return { idx: +row.dataset.i + 1, row, before: false };
  }
  return { idx: rows.length, row: rows[rows.length - 1] || null, before: false };
}
function clearDropMarks() { document.querySelectorAll('#stackList .drop-before, #stackList .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after')); }
function initStackDnD() {
  const list = document.getElementById('stackList');
  list.addEventListener('dragstart', e => {
    const row = e.target.closest?.('.stack-item');
    if (!row) return;
    e.dataTransfer.setData(DND_STACK, row.dataset.i);
    e.dataTransfer.effectAllowed = 'move';
  });
  list.addEventListener('dragover', e => {
    const types = [...(e.dataTransfer?.types || [])];
    if (!types.includes(DND_STACK) && !types.includes(DND_PAD)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = types.includes(DND_STACK) ? 'move' : 'copy';
    clearDropMarks();
    const { row, before } = stackDropIndex(e);
    row?.classList.add(before ? 'drop-before' : 'drop-after');
  });
  list.addEventListener('dragleave', e => { if (!list.contains(e.relatedTarget)) clearDropMarks(); });
  list.addEventListener('drop', e => {
    const types = [...(e.dataTransfer?.types || [])];
    if (!types.includes(DND_STACK) && !types.includes(DND_PAD)) return;
    e.preventDefault(); e.stopPropagation();
    const { idx } = stackDropIndex(e);
    clearDropMarks();
    if (types.includes(DND_STACK)) {
      const from = parseInt(e.dataTransfer.getData(DND_STACK), 10);
      if (Number.isInteger(from)) moveStackItemTo(from, idx > from ? idx - 1 : idx);
    } else {
      const padId = parseInt(e.dataTransfer.getData(DND_PAD), 10);
      if (Number.isInteger(padId)) insertPadIntoStack(padId, idx);
    }
  });
  list.addEventListener('dragend', clearDropMarks);
}

// ── Scenes ────────────────────────────────────────────────
function switchScene(idx) {
  currentSceneIdx = idx;
  renderSceneTabs();
  renderStack();
}

function addScene() {
  if (lockedOut()) return;
  const id = sceneIdSeq++;
  scenes.push({ id, name: `Scene ${scenes.length + 1}`, stack: [], stackIdx: -1 });
  switchScene(scenes.length - 1);
  scheduleAutosave();
}

function removeScene(idx) {
  if (lockedOut()) return;
  if (scenes.length <= 1) return;
  const sc = scenes[idx];
  if (sc.stack.length && !confirm(`Delete "${sc.name}" and its ${sc.stack.length} cue(s)?`)) return;
  const wasCurrent = currentSceneIdx;
  pushUndo(`deleted scene "${sc.name}"`, () => {
    scenes.splice(Math.min(idx, scenes.length), 0, sc);
    currentSceneIdx = Math.min(wasCurrent, scenes.length - 1);
    renderSceneTabs(); renderStack();
  });
  scenes.splice(idx, 1);
  if (idx < currentSceneIdx) currentSceneIdx--;         // keep the same scene selected
  else if (currentSceneIdx >= scenes.length) currentSceneIdx = scenes.length - 1;
  renderSceneTabs();
  renderStack();
  scheduleAutosave();
}

function renameScene(idx) {
  if (lockedOut()) return;
  const scene  = scenes[idx];
  const nameEl = document.querySelector(`[data-scene-idx="${idx}"] .scene-name`);
  if (!nameEl) return;
  const old = scene.name;
  const inp = document.createElement('input');
  inp.value = old;
  inp.style.cssText = 'width:70px;background:transparent;border:none;border-bottom:1px solid var(--accent);color:inherit;font-size:11px;outline:none;';
  inp.onclick = e => e.stopPropagation();
  const commit = () => { scene.name = inp.value.trim() || old; renderSceneTabs(); scheduleAutosave(); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') commit(); if (e.key === 'Escape') renderSceneTabs(); });
  inp.addEventListener('blur', commit);
  nameEl.innerHTML = '';
  nameEl.appendChild(inp);
  inp.focus(); inp.select();
}

function renderSceneTabs() {
  const wrap = document.getElementById('sceneTabsWrap');
  if (!wrap) return;
  wrap.innerHTML = scenes.map((s, i) => `
    <div class="scene-tab${i === currentSceneIdx ? ' active' : ''}"
         data-scene-idx="${i}"
         onclick="switchScene(${i})"
         ondblclick="renameScene(${i})">
      <span class="scene-name" data-notr>${escHtml(s.name)}</span>
      ${scenes.length > 1 ? `<span class="scene-tab-rm" onclick="event.stopPropagation();removeScene(${i})">×</span>` : ''}
    </div>`).join('') +
    `<button class="scene-add-btn" onclick="addScene()" title="Add scene">+</button>`;
}

// ── Pad DOM ───────────────────────────────────────────────
function buildPads() {
  const grid = document.getElementById('padsGrid');
  grid.innerHTML = '';
  pads.forEach(p => {
    const el = document.createElement('div');
    el.id = `pad${p.id}`;
    refreshPadEl(el, p);
    grid.appendChild(el);
  });
  const tile = document.createElement('div');
  tile.className = 'pad-add-tile';
  tile.title     = 'Add a new cue pad';
  tile.innerHTML = '<div class="add-icon">+</div><div class="add-label">Add Cue</div>';
  tile.addEventListener('click', addPad);
  grid.appendChild(tile);
  const fill = document.createElement('div');
  fill.className = 'pad-add-tile';
  fill.id        = 'fillPadsTile';
  fill.title     = 'Load several audio files at once into the next empty pads (or drop them on the grid)';
  fill.innerHTML = '<div class="add-icon">⇪</div><div class="add-label">Fill Pads…</div>';
  fill.addEventListener('click', pickFilesForPads);
  grid.appendChild(fill);
}

function addPad() {
  if (lockedOut()) return;
  const id = pads.length;
  pads.push(normalizePad({}, id));
  buildPads();
  requestAnimationFrame(() => document.getElementById(`pad${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
  setStatus(`Cue pad ${id + 1} added`);
  scheduleAutosave();
}

function refreshPadEl(el, pad) {
  const wave = !!(prefs.waveform && pad.peaks && pad.file);
  el.className = ['pad', pad.file ? 'loaded' : '', pad.playing ? 'playing' : '', wave ? 'has-wave' : ''].filter(Boolean).join(' ');
  el.style.setProperty('--c', pad.color);

  const capClass  = capturing === pad.id ? ' capturing' : '';
  const keyLabel  = capturing === pad.id ? '…' : (pad.key ? escHtml(pad.key.toUpperCase()) : '—');
  const emptyLabel = IS_TOUCH ? 'Tap to load audio' : 'Click or drop file';
  const nameLabel = pad.file ? escHtml(pad.name) : (pad.name ? `${escHtml(pad.name)} ⚠` : emptyLabel);
  const nameClass = pad.file ? '' : (pad.name ? ' needs-audio' : ' empty');
  const volPct    = Math.round(pad.vol * 100);
  const inSet     = pad.inPoint  !== null;
  const outSet    = pad.outPoint !== null;

  el.innerHTML = `
    <div class="pad-tint"></div>
    ${pad.playing ? '<div class="playing-dot"></div>' : ''}
    <div class="pad-inner">
      <div class="pad-left-col">
        <div class="color-dot" data-action="color" style="background:${pad.color}" title="Change colour"></div>
        <div class="shortcut-key${capClass}" data-action="capture">${keyLabel}</div>
      </div>
      <div class="pad-right-col">
        <div class="pad-name${nameClass}" id="pname${pad.id}"${pad.name ? ' data-notr' : ''}>${nameLabel}</div>
        <div class="pad-progress" id="pbar${pad.id}">
          ${wave ? `<canvas class="pad-wave" id="pwave${pad.id}" width="${WAVE_BUCKETS}" height="${WAVE_H}"></canvas>` : ''}
          <div class="pad-prog-fill" id="prog${pad.id}"></div>
          <div class="prog-active-zone" id="pzone${pad.id}"></div>
          <div class="prog-in-marker"  id="pin${pad.id}"></div>
          <div class="prog-out-marker" id="pout${pad.id}"></div>
        </div>
        ${pad.file ? `
        <div class="inout-row">
          <button class="inout-btn${inSet ? ' set' : ''}" data-action="set-in"
                  title="${inSet ? 'Click to reset IN point' : 'Set IN point at current position'}">
            ▶ ${inSet ? fmt(pad.inPoint) : 'IN'}
          </button>
          <div class="inout-spacer"></div>
          <span class="pad-time" id="ptime${pad.id}">--:-- / --:--</span>
          <div class="inout-spacer"></div>
          <button class="inout-btn${outSet ? ' set' : ''}" data-action="set-out"
                  title="${outSet ? 'Click to reset OUT point' : 'Set OUT point at current position'}">
            ${outSet ? fmt(pad.outPoint) : 'OUT'} ◼
          </button>
        </div>
        <div class="pad-transport">
          <button class="transport-pp${pad.playing ? ' is-playing' : pad.paused ? ' is-paused' : ''}" data-action="playpause">
            <span class="t-icon">${pad.playing ? '⏸' : '▶'}</span>
            <span>${pad.playing ? 'PAUSE' : pad.paused ? 'RESUME' : 'PLAY'}</span>
          </button>
          <button class="transport-stop" data-action="stop" title="Stop & rewind">■</button>
        </div>
        <div class="pad-footer">
          <button class="btn-sm${pad.loop ? ' loop-on' : ''}" data-action="loop">⟳ LOOP</button>
          <button class="btn-sm${pad.fadeEnabled ? ' fade-on' : ''}" data-action="fade-toggle">↓ FADE</button>
          <button class="btn-sm stack-btn" data-action="stack">+ Stack</button>
          <button class="btn-sm clear-pad" data-action="clear" title="Remove audio">✕</button>
        </div>
        <div class="pad-vol-row">
          <span class="vol-label">VOL</span>
          <input class="pad-vol-slider" type="range" min="0" max="1" step="0.01" value="${pad.vol}"
                 id="pvol-${pad.id}" title="Pad volume: ${volPct}%">
          <span class="vol-pct" id="pvol-pct-${pad.id}">${volPct}%</span>
        </div>` : `
        <div class="pad-footer">
          <button class="btn-sm${pad.loop ? ' loop-on' : ''}" data-action="loop">⟳ LOOP</button>
        </div>
        <div class="pad-hint">${IS_TOUCH ? 'Tap to load audio' : '+ drop audio'}</div>`}
      </div>
    </div>
  `;

  if (wave) drawWave(pad);

  // Button delegation
  el.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      switch (btn.dataset.action) {
        case 'loop':         toggleLoop(pad.id);        break;
        case 'fade-toggle':  toggleFadeEnabled(pad.id); break;
        case 'playpause':    togglePad(pad.id);         break;
        case 'stop':         stopPad(pad.id, prefs.stopFade && !pad.stopping); break;
        case 'stack':        addToStack(pad.id);        break;
        case 'clear':        clearPad(pad.id);          break;
        case 'capture':      startCapture(pad.id);      break;
        case 'color':        openColorPicker(pad.id);   break;
        case 'set-in':       setInPoint(pad.id);        break;
        case 'set-out':      setOutPoint(pad.id);       break;
      }
    });
  });

  // Volume slider
  const volSlider = document.getElementById(`pvol-${pad.id}`);
  if (volSlider) {
    volSlider.addEventListener('input', e => { e.stopPropagation(); setPadVolume(pad.id, e.target.value); });
    volSlider.addEventListener('click', e => e.stopPropagation());
  }

  // Click + drag to scrub progress bar
  // Uses offsetX / offsetWidth (both in the element's own CSS coordinate space)
  // so the ratio is correct at any padsScale zoom level — no getBoundingClientRect needed.
  const pbar = document.getElementById(`pbar${pad.id}`);
  if (pbar) {
    const doSeek = (offsetXInBar) => {
      const dur = pad.audio?.duration;
      if (!dur || !Number.isFinite(dur)) return;         // streams / headerless files report Infinity
      const frac = Math.max(0, Math.min(1, offsetXInBar / pbar.offsetWidth));
      pad.audio.currentTime = Math.min(frac * dur, Math.max(0, dur - 0.1));   // never seek onto the end — it fires 'ended'
    };
    // Convert event offsetX to pbar-relative coords even when e.target is a child element
    const pbarOffsetX = (e) => {
      if (e.target === pbar) return e.offsetX;
      // Child elements (fill, markers, zone) all have pbar as offsetParent
      return e.offsetX + (e.target.offsetLeft || 0);
    };
    pbar.addEventListener('pointerdown', e => {
      e.stopPropagation();
      pbar.setPointerCapture(e.pointerId);
      pbar.classList.add('scrubbing');
      doSeek(pbarOffsetX(e));
    });
    pbar.addEventListener('pointermove', e => {
      if (!pbar.hasPointerCapture(e.pointerId)) return;
      e.stopPropagation();
      // With capture active e.target === pbar, so offsetX is already pbar-relative
      doSeek(e.offsetX);
    });
    pbar.addEventListener('pointerup', e => {
      e.stopPropagation();
      pbar.releasePointerCapture(e.pointerId);
      pbar.classList.remove('scrubbing');
    });
    pbar.addEventListener('pointercancel', () => pbar.classList.remove('scrubbing'));
    pbar.addEventListener('click', e => e.stopPropagation());
  }

  const pnameEl = document.getElementById(`pname${pad.id}`);
  if (pnameEl) {
    // Desktop: double-click to rename
    pnameEl.addEventListener('dblclick', (e) => { e.stopPropagation(); startRename(pad.id); });
    if (pad.file && !IS_TOUCH) {
      pnameEl.draggable = true;
      pnameEl.title = 'Drag onto the cue stack to add it';
      pnameEl.addEventListener('dragstart', e => { e.dataTransfer.setData(DND_PAD, String(pad.id)); e.dataTransfer.effectAllowed = 'copy'; });
    }
    // Touch: long-press (500ms) to rename
    if (IS_TOUCH) {
      let _lpTimer = null;
      pnameEl.addEventListener('touchstart', () => { _lpTimer = setTimeout(() => startRename(pad.id), 500); }, { passive: true });
      pnameEl.addEventListener('touchend',   () => clearTimeout(_lpTimer), { passive: true });
      pnameEl.addEventListener('touchmove',  () => clearTimeout(_lpTimer), { passive: true });
    }
  }

  // `el` persists across refreshes (only its innerHTML is rebuilt), so these must be bound
  // exactly once — otherwise every refresh stacks another handler and a pad click toggles
  // play/pause several times, or opens several file pickers.
  if (!el._bound) {
    el._bound = true;
    const id = pad.id;
    el.addEventListener('click', e => {
      if (e.target.closest('[data-action],input')) return;
      pads[id].file ? togglePad(id) : browseFile(id);
    });
    el.addEventListener('dragover',  e => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()  => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drag-over');
      const dropped = [...e.dataTransfer.files];
      if (dropped.length > 1) fillPadsFrom(dropped, id);
      else if (dropped[0]) loadFile(id, dropped[0]);
    });
  }
}

function refreshPad(id) {
  const el = document.getElementById(`pad${id}`);
  if (el) refreshPadEl(el, pads[id]);
}

// ── RAF: progress bar + time display ─────────────────────
function fmt(secs) {
  const s = Math.floor(secs);
  return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
}

function startRaf() {
  const tickPad = pad => {
      if (!pad.audio || !pad.file) return;
      const bar     = document.getElementById(`prog${pad.id}`);
      const timeEl  = document.getElementById(`ptime${pad.id}`);
      const inMark  = document.getElementById(`pin${pad.id}`);
      const outMark = document.getElementById(`pout${pad.id}`);
      const zone    = document.getElementById(`pzone${pad.id}`);
      const dur = pad.audio.duration;
      const cur = pad.audio.currentTime;
      if (bar)    bar.style.width = (dur ? cur / dur * 100 : 0) + '%';
      if (timeEl) {
        // Playing / paused: count DOWN to the end (or OUT point) — what an operator needs; idle: position / length
        const active = pad.playing || pad.paused;
        let txt = '--:-- / --:--';
        if (Number.isFinite(dur) && dur) {
          txt = !active ? `${fmt(cur)} / ${fmt(dur)}`
              : (pad.loop && pad.outPoint === null) ? `⟳ / ${fmt(dur)}`
              : `−${fmtRem((pad.outPoint ?? dur) - cur)} / ${fmt(dur)}`;
        }
        if (timeEl.textContent !== txt) timeEl.textContent = txt;
        timeEl.title = Number.isFinite(dur) && dur ? `elapsed ${fmt(cur)} of ${fmt(dur)}` : '';
      }
      const stTxt = stackTimeText(pad);
      document.querySelectorAll(`#stackList .stack-time[data-pad="${pad.id}"]`).forEach(el => { if (el.textContent !== stTxt) el.textContent = stTxt; });

      if (dur) {
        // In marker
        if (inMark) {
          if (pad.inPoint !== null) {
            inMark.style.display = '';
            inMark.style.left = (pad.inPoint / dur * 100) + '%';
          } else { inMark.style.display = 'none'; }
        }
        // Out marker
        if (outMark) {
          if (pad.outPoint !== null) {
            outMark.style.display = '';
            outMark.style.left = (pad.outPoint / dur * 100) + '%';
          } else { outMark.style.display = 'none'; }
        }
        // Active zone between in/out
        if (zone) {
          if (pad.inPoint !== null || pad.outPoint !== null) {
            const l = (pad.inPoint  !== null ? pad.inPoint  / dur : 0) * 100;
            const r = (pad.outPoint !== null ? pad.outPoint / dur : 1) * 100;
            zone.style.display = '';
            zone.style.left  = l + '%';
            zone.style.width = (r - l) + '%';
          } else { zone.style.display = 'none'; }
        }
        // Out-point enforcement
        if (pad.outPoint !== null && pad.playing && cur >= pad.outPoint - 0.05) {
          if (pad.loop) {
            pad.audio.currentTime = pad.inPoint ?? 0;
          } else {
            stopPad(pad.id, false);
            setStatus(`"${pad.name}" finished`);
            if (autoAdv) checkAutoAdvance(pad.id);
          }
        }
      }
  };
  (function tick() {
    requestAnimationFrame(tick);   // schedule first, and isolate each pad: one bad pad must not stop the loop
    pads.forEach(pad => { try { tickPad(pad); } catch (e) { console.error('tick', e); } });
    try { pushRemoteState(performance.now()); } catch (e) { console.error('remote state', e); }
  })();
}

// ── Rename ────────────────────────────────────────────────
function startRename(id) {
  if (lockedOut()) return;
  const pad    = pads[id];
  if (!pad.file) return;
  const nameEl = document.getElementById(`pname${id}`);
  if (!nameEl) return;
  const inp = document.createElement('input');
  inp.value   = pad.name;
  inp.onclick = e => e.stopPropagation();
  const commit = () => { pad.name = inp.value.trim() || pad.name; refreshPad(id); renderStack(); scheduleAutosave(); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') commit(); if (e.key === 'Escape') refreshPad(id); });
  inp.addEventListener('blur', commit);
  nameEl.classList.remove('empty');
  nameEl.draggable = false;
  nameEl.innerHTML = '';
  nameEl.appendChild(inp);
  inp.focus(); inp.select();
}

// ── Keyboard ──────────────────────────────────────────────
function getCombo(e) {
  const parts = [];
  if (e.ctrlKey)  parts.push('Ctrl');
  if (e.altKey)   parts.push('Alt');
  if (e.metaKey && !['Shift','Control','Alt','Meta'].includes(e.key)) parts.push('Meta');
  if (e.shiftKey && !['Shift','Control','Alt','Meta'].includes(e.key)) parts.push('Shift');
  if (!['Control','Alt','Shift','Meta'].includes(e.key)) {
    const key = e.key === ' ' ? 'Space' : e.key.length === 1 ? e.key.toUpperCase() : e.key;
    parts.push(key);
  }
  return parts.join('+');
}

function onKey(e) {
  const modalOpen = !document.getElementById('modalOverlay').classList.contains('hidden');

  // PANIC: Escape cuts everything instantly, even with focus in a slider or the FADE box. It only yields
  // to what Escape already means: cancelling a key capture, and closing a modal (the rename boxes
  // stop their own Escape from reaching here).
  if (e.key === 'Escape' && !capturingHotkey && capturing === null) {
    if (modalOpen) { e.preventDefault(); closeModal(); return; }
    e.preventDefault();
    if (!e.repeat) { document.activeElement?.blur?.(); stopAll('cut'); }
    return;
  }

  // Ignore typing in text fields — but not sliders/checkboxes: after dragging the master-volume
  // slider focus stays on it, and SPACE / pad keys must keep working.
  const t = e.target;
  if (t.tagName === 'TEXTAREA' || t.isContentEditable ||
      (t.tagName === 'INPUT' && !['range','checkbox','radio','button','color'].includes(t.type))) return;
  // Holding a key auto-repeats keydown: without this, a held pad key toggles the pad on/off
  // and a held SPACE races through the whole stack.
  if (e.repeat) { e.preventDefault(); return; }

  if (capturingHotkey) {
    if (['Control','Alt','Shift','Meta'].includes(e.key)) return;
    e.preventDefault();
    if (e.key === 'Escape') { cancelHotkeyCapture(); return; }
    pendingCombo = getCombo(e);
    capturingHotkey = false;
    const btn = document.getElementById('captureComboBtn');
    if (btn) { btn.textContent = pendingCombo; btn.classList.remove('capturing'); }
    document.getElementById('sh-pad-select')?.removeAttribute('disabled');
    return;
  }

  if (capturing !== null) {
    e.preventDefault();
    if (e.key === 'Escape') { endCapture(capturing); return; }
    if (['Control','Alt','Shift','Meta','CapsLock','Dead','Unidentified'].includes(e.key)) return;   // modifier alone isn't a key
    if (e.key === ' ') { setStatus('SPACE is reserved for Next Cue — press another key'); return; }
    const newKey   = e.key.toLowerCase();
    if (customShortcuts.some(sc => sc.combo === getCombo(e))) {
      setStatus(`"${getCombo(e)}" is already a custom shortcut — press another key`);
      return;
    }
    const conflict = pads.find(p => p.id !== capturing && p.key === newKey);
    if (conflict) {
      conflict.key = pads[capturing].key;
      refreshPad(conflict.id);
      const cb = document.getElementById(`sh-pad-key-${conflict.id}`);
      if (cb) cb.textContent = conflict.key.toUpperCase();
    }
    pads[capturing].key = newKey;
    endCapture(capturing);
    return;
  }

  if (modalOpen) return;

  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.shiftKey && e.key.toLowerCase() === 'l')   { e.preventDefault(); toggleShowLock(); return; }

  if (e.key === ' ') { e.preventDefault(); nextCue(); return; }

  const combo  = getCombo(e);
  const custom = customShortcuts.find(s => s.combo === combo);
  if (custom?.padId != null && pads[custom.padId]?.file) {
    e.preventDefault();
    togglePadCrossfade(custom.padId);
    return;
  }

  if (!e.ctrlKey && !e.altKey && !e.metaKey) {
    const k   = e.key.toLowerCase();
    const pad = pads.find(p => p.key && p.key === k);
    if (pad?.file) { e.preventDefault(); togglePadCrossfade(pad.id); }
  }
}

// ── Shortcut capture ──────────────────────────────────────
function startCapture(id) {
  if (lockedOut()) return;
  if (capturing !== null && capturing !== id) endCapture(capturing);
  capturing = id;
  refreshPad(id);
  setStatus('Press any key to assign shortcut — Esc to cancel');
}

function endCapture(id) {
  capturing = null;
  refreshPad(id);
  const badge = document.getElementById(`sh-pad-key-${id}`);
  if (badge) { badge.textContent = pads[id].key.toUpperCase(); badge.classList.remove('capturing'); }
  setStatus('Shortcut saved');
  scheduleAutosave();
}

// ── Project data validation ───────────────────────────────
// Project files (.cuepro, cue-project.json, iPad imports) and the autosave are untrusted input.
// Colours, ids and names end up in innerHTML, style attributes and inline handlers, and volumes in
// HTMLMediaElement.volume (which throws outside [0,1]) — so everything is normalised once, here,
// BEFORE any live state is touched: a bad file must not silence a running show or half-apply.
const HEX_COLOR = /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i;
const MAX_PADS  = 500;
let projectLoading = false;   // blocks a second load starting while audio is still being read

function safeNum(v, lo, hi, dflt) {
  if (v === null || v === undefined || v === '') return dflt;
  v = Number(v);
  return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt;
}

function normalizePad(pc, i) {
  pc = pc && typeof pc === 'object' ? pc : {};
  const inPoint = safeNum(pc.inPoint, 0, 86400, null);
  let outPoint  = safeNum(pc.outPoint, 0, 86400, null);
  if (inPoint !== null && outPoint !== null && outPoint <= inPoint) outPoint = null;
  return {
    id: i,                                         // ids are array indexes everywhere else in the app
    key:   typeof pc.key  === 'string' ? pc.key.slice(0, 20)   : '',
    color: HEX_COLOR.test(pc.color)    ? pc.color              : COLORS[i % COLORS.length],
    name:  typeof pc.name === 'string' ? pc.name.slice(0, 200) : '',
    file: null, audio: null, audioUrl: null, filePath: null, peaks: null,
    missingPath: null,                             // saved path whose file wasn't found — kept so Save doesn't drop the link
    loop: pc.loop === true, playing: false, paused: false,
    vol:  safeNum(pc.vol, 0, 1, 1),
    fadeEnabled: pc.fadeEnabled === true,
    inPoint, outPoint,
  };
}

// Validate + normalise a project/session object. Pure: throws a readable Error, never touches live state.
function parseProjectConfig(config) {
  if (!config || typeof config !== 'object') throw new Error('not a project file');
  if (!Array.isArray(config.pads)) {
    throw new Error(Array.isArray(config.config?.pads)
      ? 'this is an iPad / browser export — import it from the Load screen of the web app'
      : 'no pads found in file');
  }
  if (!config.pads.length)          throw new Error('the project has no pads');
  if (config.pads.length > MAX_PADS) throw new Error(`too many pads (max ${MAX_PADS})`);

  const padList = config.pads.map(normalizePad);
  const validId = id => Number.isInteger(id) && id >= 0 && id < padList.length;

  const rawScenes = Array.isArray(config.scenes) && config.scenes.length
    ? config.scenes
    : [{ name: 'Scene 1', stack: config.stack, stackIdx: config.stackIdx }];   // legacy single-stack projects
  const sceneList = rawScenes.map((sc, i) => {
    const stack = (Array.isArray(sc?.stack) ? sc.stack : []).filter(validId).map(padId => ({ padId }));
    const idx   = Number.isInteger(sc?.stackIdx) ? sc.stackIdx : -1;
    return {
      id: i,
      name: typeof sc?.name === 'string' && sc.name.trim() ? sc.name.slice(0, 100) : `Scene ${i + 1}`,
      stack,
      stackIdx: Math.min(Math.max(idx, -1), stack.length - 1),
    };
  });

  const shortcuts = (Array.isArray(config.customShortcuts) ? config.customShortcuts : [])
    .filter(sc => sc && typeof sc.combo === 'string' && sc.combo && validId(sc.padId))
    .map((sc, i) => ({ id: i, combo: sc.combo.slice(0, 40), padId: sc.padId }));

  const curScene = Number.isInteger(config.currentSceneIdx) ? config.currentSceneIdx : 0;
  return {
    pads: padList,
    scenes: sceneList,
    currentSceneIdx: Math.min(Math.max(curScene, 0), sceneList.length - 1),
    customShortcuts: shortcuts,
    settings: {
      autoAdv:      config.autoAdv === true,
      masterVol:    safeNum(config.masterVol, 0, 1, 1),
      fadeDuration: safeNum(config.fadeDuration, 0, 20, 2),
      padsScale:    safeNum(config.padsScale ?? config.uiScale, 0.4, 2, 1),
      stackScale:   safeNum(config.stackScale, 0.7, 1.6, 1),
    },
  };
}

// Swap a parsed project in as the live state: stop + release the old pads, apply, rebuild the UI.
function commitProject(parsed) {
  clearTimeout(advTimer);
  pads.forEach(p => { clearFadeTimer(p.id); releaseAudio(p); });
  pads            = parsed.pads;
  scenes          = parsed.scenes;
  sceneIdSeq      = scenes.length;
  currentSceneIdx = parsed.currentSceneIdx;
  customShortcuts = parsed.customShortcuts;
  shortcutIdSeq   = customShortcuts.length;
  ({ autoAdv, masterVol, fadeDuration, padsScale, stackScale } = parsed.settings);
  // Audio was attached before these settings were applied, so it still carries the previous master volume
  pads.forEach(p => { if (p.audio) p.audio.volume = clamp01(p.vol * masterVol); });
  capturing = null;
  document.getElementById('volSlider').value      = masterVol;
  document.getElementById('fadeDurInput').value   = fadeDuration;
  document.getElementById('autoToggle').className = `toggle-sw${autoAdv ? ' on' : ''}`;
  applyScales();
  buildPads(); renderSceneTabs(); renderStack();
}

// ── Save / Load ───────────────────────────────────────────
function sanitizeFilename(n) {
  // \w is ASCII-only, so non-Latin names (Greek, etc.) used to collapse to the same "_____" folder and overwrite each other
  return String(n).replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').replace(/[. ]+$/, '').trim().replace(/^\.+$/, '') || 'project';
}

async function saveProject(name) {
  if (!name.trim()) return;
  name = name.trim();
  if (!window.showDirectoryPicker) { setStatus('Folder save requires Chrome or Edge'); return; }
  let dirHandle;
  try {
    const parent = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'documents' });
    dirHandle    = await parent.getDirectoryHandle(sanitizeFilename(name), { create: true });
  } catch (e) { if (e.name !== 'AbortError') setStatus('Could not create project folder'); return; }

  setStatus('Copying audio files…');
  const padConfigs = [];
  for (const p of pads) {
    const pc = { id: p.id, key: p.key, name: p.name, loop: p.loop, vol: p.vol, fadeEnabled: p.fadeEnabled, color: p.color, audioFile: null, inPoint: p.inPoint ?? null, outPoint: p.outPoint ?? null };
    if (p.file) {
      const fname = `pad_${p.id}_${sanitizeFilename(p.file.name)}`;
      try {
        const fh = await dirHandle.getFileHandle(fname, { create: true });
        const w  = await fh.createWritable();
        await w.write(p.file); await w.close();
        pc.audioFile = fname;
      } catch (err) { console.warn('Audio copy failed pad', p.id, err); }
    }
    padConfigs.push(pc);
  }

  const config = {
    name, version: 3, savedAt: Date.now(),
    masterVol, autoAdv, fadeDuration, padsScale, stackScale,
    scenes: scenes.map(s => ({ id: s.id, name: s.name, stack: s.stack.map(i => i.padId), stackIdx: s.stackIdx })),
    currentSceneIdx,
    customShortcuts,
    pads: padConfigs,
  };
  try {
    const fh = await dirHandle.getFileHandle('cue-project.json', { create: true });
    const w  = await fh.createWritable();
    await w.write(JSON.stringify(config, null, 2)); await w.close();
  } catch (e) { setStatus('Failed to write project config'); return; }

  await dbPut('projects', { name, savedAt: Date.now(), dirHandle });
  localStorage.removeItem('cue-autosave');
  closeModal();
  setStatus(`"${name}" saved — ${padConfigs.filter(p => p.audioFile).length} audio file(s)`);
}

async function loadProject(name) {
  const entry = await dbGet('projects', name);
  if (!entry?.dirHandle) { setStatus('Project entry not found'); return; }
  let perm;
  try   { perm = await entry.dirHandle.requestPermission({ mode: 'readwrite' }); }
  catch { perm = 'denied'; }
  if (perm !== 'granted') { showBrowsePrompt(name); return; }
  await doLoadFromFolder(entry.dirHandle, name);
}

async function doLoadFromFolder(dirHandle, projectName) {
  if (projectLoading) return;
  let config, parsed;
  try {
    const fh = await dirHandle.getFileHandle('cue-project.json');
    config   = JSON.parse(await (await fh.getFile()).text());
  } catch { setStatus('No cue-project.json found in this folder'); return; }
  try { parsed = parseProjectConfig(config); }
  catch (e) { setStatus(`Cannot load project — ${e.message}`); return; }

  projectLoading = true;
  try {
    const missing = [];
    for (let i = 0; i < parsed.pads.length; i++) {
      const pc = config.pads[i];
      if (typeof pc?.audioFile !== 'string' || !pc.audioFile) continue;
      try {
        const fh = await dirHandle.getFileHandle(pc.audioFile);
        attachAudio(parsed.pads[i], await fh.getFile());
      } catch { missing.push({ padId: i, fileName: pc.audioFile, padName: parsed.pads[i].name }); }
    }
    commitProject(parsed);

    // Register under the name stored in the project itself — registering under whatever name the
    // user clicked would repoint that entry at an unrelated folder if they browsed to the wrong one.
    const regName = typeof config.name === 'string' && config.name.trim() ? config.name.trim().slice(0, 100) : projectName;
    if (regName) {
      try { await dbPut('projects', { name: regName, savedAt: config.savedAt ?? Date.now(), dirHandle }); }
      catch (e) { console.warn('Could not update the project list', e); }
    }
    localStorage.removeItem('cue-autosave');
    closeModal();

    if (missing.length) {
      setStatus(`Loaded — ${missing.length} audio file(s) not found`);
      showMissingFilesDialog(missing, regName ?? '');
    } else {
      setStatus(`"${config.name ?? regName ?? 'Project'}" loaded — ${pads.filter(p => p.file).length} sound(s) ready`);
    }
  } finally { projectLoading = false; }
}

function handleSave() {

    currentSavePath ? doElectronSave(currentSavePath) : doElectronSaveAs();
  } else if (HAS_FILE_SYSTEM_API) {
    showSaveModal();
  } else {
    showIdbSaveModal();    // iPad / Safari
  }
}

  if (IS_ELECTRON)          { doElectronSaveAs(); }
  else if (HAS_FILE_SYSTEM_API) { showSaveModal(); }
  else                      { showIdbSaveModal(); }
}
function handleLoad() {
  if (lockedOut()) return;
  if (IS_ELECTRON)          { loadElectronProject(); }
  else if (HAS_FILE_SYSTEM_API) { showLoadModal(); }
  else                      { showIdbLoadModal(); }

// ── Electron Save ─────────────────────────────────────────
async function doElectronSaveAs() {
  const defaultPath = currentSavePath || 'My Show.cuepro';
  const savePath = await window.electronAPI.showSaveDialog(defaultPath);
  if (!savePath) return;
  await doElectronSave(savePath);
}

async function doElectronSave(savePath) {
  const projectName = savePath.replace(/.*[\\/]/, '').replace(/\.cuepro$/i, '');
  const config = {
    name: projectName, version: 5, savedAt: Date.now(),
    masterVol, autoAdv, fadeDuration, padsScale, stackScale,
    scenes: scenes.map(s => ({
      id: s.id, name: s.name,
      stack: s.stack.map(i => i.padId), stackIdx: s.stackIdx
    })),
    currentSceneIdx, customShortcuts,
    pads: pads.map(p => ({
      id: p.id, key: p.key, name: p.name,
      loop: p.loop, vol: p.vol, fadeEnabled: p.fadeEnabled, color: p.color,
      // p.missingPath: the file wasn't found on load — keep the link so saving doesn't destroy it
      audioPath: p.filePath || p.missingPath || null,
      inPoint: p.inPoint ?? null, outPoint: p.outPoint ?? null
    }))
  };
  try {
    await window.electronAPI.writeTextFile(savePath, JSON.stringify(config, null, 2));
    currentSavePath = savePath;
    localStorage.removeItem('cue-autosave');
    setStatus(`Saved — "${projectName}"`);
  } catch (e) {
    if (/Write not permitted/.test(e.message)) {   // path wasn't picked in this session — ask the user
      currentSavePath = null;
      doElectronSaveAs();
      return;
    }
    setStatus('Save failed: ' + e.message);
  }
}

// ── Electron Load ─────────────────────────────────────────
async function loadElectronProject() {
  if (projectLoading) return;
  const loadPath = await window.electronAPI.showOpenFileDialog();
  if (!loadPath) return;

  let config, parsed;
  try {
    config = JSON.parse(await window.electronAPI.readTextFile(loadPath));
  } catch { setStatus('Could not read project file'); return; }
  // Reject anything that isn't an Electron project BEFORE touching state — otherwise loading the
  // wrong kind of .cuepro would blank the show, and the next Save would overwrite that file with an empty project.
  try { parsed = parseProjectConfig(config); }
  catch (e) { setStatus(`Cannot load project — ${e.message}`); return; }

  projectLoading = true;
  try {
    const missing = [];
    for (let i = 0; i < parsed.pads.length; i++) {
      const pc  = config.pads[i];
      const pad = parsed.pads[i];
      if (typeof pc?.audioPath !== 'string' || !pc.audioPath) continue;
      try {
        if (await window.electronAPI.fileExists(pc.audioPath)) {
          const buf      = await window.electronAPI.readFile(pc.audioPath);
          const fileName = pc.audioPath.replace(/.*[\\/]/, '');
          attachAudio(pad, new File([new Blob([buf])], fileName));
          pad.filePath = pc.audioPath;
          continue;
        }
      } catch {}
      pad.missingPath = pc.audioPath;
      missing.push({ padId: i, audioPath: pc.audioPath, padName: pad.name });
    }

    commitProject(parsed);
    currentSavePath = loadPath;
    localStorage.removeItem('cue-autosave');

    if (missing.length) {
      setStatus(`Loaded — ${missing.length} file(s) not found`);
      showElectronMissingDialog(missing);
    } else {
      setStatus(`"${config.name ?? 'Project'}" loaded — ${pads.filter(p => p.file).length} sound(s) ready`);
    }
  } finally { projectLoading = false; }
}

      </div>

async function electronLocateFile(padId) {
  const filePath = await window.electronAPI.showOpenAudioDialog();
  if (!filePath) return;
  const pad = pads[padId];
  if (!pad) return;
  try {
    const buf      = await window.electronAPI.readFile(filePath);
    const fileName = filePath.replace(/.*[\\/]/, '');
    attachAudio(pad, new File([new Blob([buf])], fileName));
    pad.filePath = filePath;
    _pendingMissing = _pendingMissing.filter(f => f.padId !== padId);
    refreshPad(padId);
    renderStack();
    const btn = document.getElementById(`locate-btn-${padId}`);
    if (btn) { btn.textContent = '✓ Linked'; btn.disabled = true; btn.style.cssText += ';border-color:var(--save-col);color:var(--save-col)'; }
    setStatus(`"${pad.name}" linked`);
  } catch { setStatus('Could not load file'); }
}

async function electronBrowseFolder() {
  const folder = await window.electronAPI.showOpenFolderDialog();
  if (!folder) return;
  let found = 0;
  for (const f of _pendingMissing) {
    const fileName = f.audioPath.replace(/.*[\\/]/, '');
    const fullPath = await window.electronAPI.joinPath(folder, fileName);
    if (!(await window.electronAPI.fileExists(fullPath))) continue;
    const pad = pads[f.padId];
    if (!pad || pad.file) continue;              // already linked by hand via Locate… — don't overwrite it
    try {
      const buf = await window.electronAPI.readFile(fullPath);
      attachAudio(pad, new File([new Blob([buf])], fileName));
      pad.filePath = fullPath;
      refreshPad(f.padId);
      found++;
    } catch {}
  }
  renderStack();
  closeModal();
  setStatus(`Reconnected ${found} of ${_pendingMissing.length} file(s)`);
}

// ── Pre-show check ────────────────────────────────────────
// One pass over everything a show depends on. Returns { items:[{level,text,padId?}], sounds, cues, scenes, verdict }.
// level: 'fail' = will go wrong on the night · 'warn' = probably wrong · 'info' = worth knowing.
function waitForMetadata(audio, ms = 4000) {
  return new Promise(res => {
    if (audio.readyState >= 1 || audio.error) return res();
    const done = () => { clearTimeout(t); audio.removeEventListener('loadedmetadata', done); audio.removeEventListener('error', done); res(); };
    const t = setTimeout(done, ms);
    audio.addEventListener('loadedmetadata', done); audio.addEventListener('error', done);
  });
}

async function runPreShowCheck() {
  const items = [];
  const add = (level, text, padId = null) => items.push({ level, text, padId });
  const label = p => `Pad ${p.id + 1}${p.name ? ` "${p.name}"` : ''}`;
  const inAnyStack = id => scenes.some(sc => sc.stack.some(it => it.padId === id));

  const loaded = pads.filter(p => p.file && p.audio);
  await Promise.all(loaded.map(p => waitForMetadata(p.audio)));

  for (const p of pads) {
    if (p.file && p.audio) {
      const a = p.audio, dur = a.duration;
      if (a.error) { add('fail', `${label(p)}: the audio file can't be opened (${a.error.message || 'unsupported or damaged'})`, p.id); continue; }
      if (a.readyState < 1) { add('warn', `${label(p)}: still loading — try again in a moment`, p.id); continue; }
      if (!Number.isFinite(dur))      add('warn', `${label(p)}: the length can't be determined (IN/OUT and the countdown may not work)`, p.id);
      else if (dur <= 0)              add('fail', `${label(p)}: the audio is empty`, p.id);
      else {
        if (p.inPoint !== null && p.inPoint >= dur)                              add('fail', `${label(p)}: the IN point (${fmt(p.inPoint)}) is past the end of the sound (${fmt(dur)})`, p.id);
        else if (p.inPoint !== null && p.outPoint !== null && p.outPoint <= p.inPoint) add('fail', `${label(p)}: the OUT point is not after the IN point`, p.id);
        else if (p.outPoint !== null && p.outPoint > dur + 0.5)                  add('warn', `${label(p)}: the OUT point (${fmt(p.outPoint)}) is past the end of the sound (${fmt(dur)})`, p.id);
      }
      if (p.vol === 0) add('warn', `${label(p)}: its volume slider is at 0`, p.id);
      // Electron: the sound plays from memory, but the project will only reload if the original file is still where it was
      if (IS_ELECTRON && p.filePath) {
        let exists = true;
        try { exists = await window.electronAPI.fileExists(p.filePath); } catch {}
        if (!exists) add('warn', `${label(p)}: the original file has moved or been deleted (${p.filePath}) — it plays now, but reopening the project won't find it`, p.id);
      }
    } else if (p.missingPath) {
      add('fail', `${label(p)}: audio file not found (${p.missingPath})`, p.id);
    } else if (p.name && !p.file) {
      add(inAnyStack(p.id) ? 'fail' : 'warn', `${label(p)}: no audio loaded${inAnyStack(p.id) ? ' but it is in the cue stack' : ''}`, p.id);
    }
  }

  let cues = 0;
  scenes.forEach(sc => {
    if (!sc.stack.length) add('info', `Scene "${sc.name}" has no cues`);
    sc.stack.forEach((it, i) => {
      cues++;
      const p = pads[it.padId];
      if (!p?.audio) add('fail', `Scene "${sc.name}", cue ${i + 1} (${label(p || { id: it.padId, name: '' })}) has no audio — SPACE would skip it`, it.padId);
    });
  });

  if (masterVol < 0.99) add('warn', `Master volume is at ${Math.round(masterVol * 100)}%`);
  if (outputProblem) add('fail', outputProblem);
  else if (CAN_SET_SINK && prefs.outputId) {
    const devs = await listOutputDevices();
    if (devs.length && !devs.some(d => d.deviceId === prefs.outputId)) add('fail', 'The saved audio output device is not connected — sound would play on the system default');
    else add('info', 'Playing through the saved audio output device');
  }
  if (IS_ELECTRON && !currentSavePath) add('warn', "This project hasn't been saved to a file yet");
  if (autoAdv)       add('info', 'Auto-advance is ON — cues will start each other');
  if (prefs.stopFade) add('info', `STOP FADE is ON — STOP ALL fades out over ${fadeDuration}s (Esc always cuts instantly)`);
  if (showLocked)    add('info', 'The show is locked — editing is disabled');

  const fails = items.filter(i => i.level === 'fail').length, warns = items.filter(i => i.level === 'warn').length;
  return { items, sounds: loaded.length, cues, scenes: scenes.length, fails, warns,
           verdict: fails ? 'NOT READY' : warns ? 'READY — WITH WARNINGS' : 'READY' };
}

function focusPad(id) {
  closeModal();
  const el = document.getElementById(`pad${id}`);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1800);
}

async function showPreShowCheck() {
  const closeBtn = '<button class="modal-btn" onclick="closeModal()">Close</button>';
  openModal('PRE-SHOW CHECK', '<div class="chk-run">Checking every sound, cue and setting…</div>',
    `<button class="modal-btn" onclick="showPreShowCheck()">↻ Check again</button>${closeBtn}`);
  document.getElementById('modalBox').classList.add('wide');
  const r = await runPreShowCheck();
  const cls = r.fails ? 'bad' : r.warns ? 'warn' : 'good';
  const icon = { fail: '✗', warn: '⚠', info: 'ℹ' };
  document.getElementById('modalBody').innerHTML = `
    <div class="chk-verdict ${cls}" id="chkVerdict">${r.fails ? '✗' : r.warns ? '⚠' : '✔'} ${r.verdict}</div>
    <div class="chk-sum"><span>${r.sounds} sound(s) loaded · ${r.cues} cue(s) in ${r.scenes} scene(s)</span>${r.fails ? ` · <b>${r.fails} problem(s)</b>` : ''}${r.warns ? ` · <span>${r.warns} warning(s)</span>` : ''}</div>
    ${r.items.length ? `<div class="chk-list">${r.items.map(i => `
      <div class="chk-item ${i.level}"><span class="chk-ic">${icon[i.level]}</span><span class="chk-tx">${escHtml(i.text)}</span>
        ${i.padId !== null ? `<button class="modal-btn chk-go" onclick="focusPad(${i.padId})">Go to pad</button>` : ''}</div>`).join('')}</div>`
      : '<div class="chk-sum">Nothing to report — every sound opens, every cue has audio and the settings look right.</div>'}`;
}

SETTINGS_SECTIONS.push({
  id: 'appearance', title: 'Appearance',
  html: () => `<div class="set-row"><span>Theme</span>
      <span><button class="modal-btn${(document.documentElement.dataset.theme || 'light') === 'light' ? ' primary' : ''}" onclick="applyTheme('light');renderSettings()">Light</button>
      <button class="modal-btn${document.documentElement.dataset.theme === 'dark' ? ' primary' : ''}" onclick="applyTheme('dark');renderSettings()">Dark</button></span></div>

      </select></div>

      <input type="checkbox" ${prefs.waveform ? 'checked' : ''} onchange="setWaveformPref(this.checked)"></label>`,
});

SETTINGS_SECTIONS.push({
  id: 'output', title: 'Audio output',
  html: () => CAN_SET_SINK
    ? `<div class="set-row"><span>Play sound through</span><select class="sh-select" id="outputSelect" onchange="setOutputDevice(this.value).then(renderSettings)"><option value="">System default</option></select></div>
       <div class="set-row"><span><small>Saved for this computer only. If the device is missing at launch the system default is used and you are warned.</small></span>
       <button class="modal-btn" onclick="playTestTone()">🔊 Test tone</button></div>
       <div class="set-warn" id="outputWarn">${outputProblem ? '⚠ ' + escHtml(outputProblem) : ''}</div>`
    : `<div class="set-row"><span><small>Choosing an output device isn't supported by this browser (Safari / iPad always use the system output).</small></span></div>`,
  after: async () => {
    const sel = document.getElementById('outputSelect');
    if (!sel) return;
    const devs = await listOutputDevices();
    devs.filter(d => d.deviceId !== 'default' && d.deviceId !== 'communications').forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId; o.textContent = d.label || `Output ${i + 1}`;
      sel.appendChild(o);
    });
    if (prefs.outputId && ![...sel.options].some(o => o.value === prefs.outputId)) {   // saved device isn't present right now
      const o = document.createElement('option');
      o.value = prefs.outputId; o.textContent = '⚠ Saved device (not connected)';
      sel.appendChild(o);
    }
    sel.value = prefs.outputId;
  },
});

function setWaveformPref(on) {
  prefs.waveform = !!on;
  savePrefs();
  if (on) pads.forEach(p => queuePeaks(p));
  else pads.forEach(p => { p.peaks = null; });
  pads.forEach(p => refreshPad(p.id));
}
// ── Remote commands (shared by the remote API and MIDI) ───
// The ONLY way anything outside the window can drive the app. Playback commands only — nothing here can edit, delete,
// load, save or lock. remote.js validates the same shapes on the server side; this is the second, independent check.
function normalizeRemoteCommand(c) {
  if (!c || typeof c !== 'object' || Array.isArray(c)) return null;
  const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  switch (c.type) {
    case 'pad_toggle':
    case 'pad_stop':      return int(c.id, 0, MAX_PADS - 1) ? { type: c.type, id: c.id } : null;
    case 'cue_select':    return int(c.index, 0, 9999) ? { type: c.type, index: c.index } : null;
    case 'master':        return typeof c.value === 'number' && Number.isFinite(c.value) ? { type: 'master', value: clamp01(c.value) } : null;
    case 'stop_all': case 'stop_all_auto': case 'cue_play': case 'cue_next': return { type: c.type };
    default:              return null;
  }
}
function handleRemoteCommand(cmd) {
  const c = normalizeRemoteCommand(cmd);
  if (!c) return false;
  switch (c.type) {
    case 'pad_toggle':    if (!pads[c.id]?.audio) return false; togglePadCrossfade(c.id); return true;
    case 'pad_stop':      { const p = pads[c.id]; if (!p?.audio || !p.playing) return false; stopPad(c.id, prefs.stopFade && !p.stopping); return true; }
    case 'stop_all':      stopAll('cut'); return true;                 // panic: instant
    case 'stop_all_auto': stopAll('auto'); return true;                // follows STOP FADE
    case 'cue_play':      playCue(); return true;
    case 'cue_next':      nextCue(); return true;
    case 'cue_select':    if (c.index >= getScene().stack.length) return false; playStackItem(c.index); return true;
    case 'master':        { const sl = document.getElementById('volSlider'); if (sl) sl.value = c.value; setMasterVolume(c.value); return true; }
  }
  return false;
}

// ── Remote control bridge (desktop app) ───────────────────
const HAS_REMOTE = !!(typeof window !== 'undefined' && window.electronAPI?.remote);
let remoteActive = false, remoteLastSig = '', remoteLastAt = 0;

function buildRemoteState() {
  const sc = getScene();
  return {
    v: 1,
    pads: pads.map(p => {
      const dur = p.audio?.duration;
      const remain = (p.playing || p.paused) && Number.isFinite(dur) ? Math.ceil(Math.max(0, (p.outPoint ?? dur) - p.audio.currentTime)) : null;
      return { id: p.id, name: p.name, color: p.color, key: p.key, loaded: !!p.audio, playing: p.playing, paused: p.paused, stopping: !!p.stopping, remain };
    }),
    scene: { index: currentSceneIdx, name: sc.name },
    scenes: scenes.map(x => x.name),
    stack: sc.stack.map(it => ({ padId: it.padId, name: pads[it.padId]?.name || '', noAudio: !pads[it.padId]?.audio })),
    stackIdx: sc.stackIdx,
    masterVol, autoAdv, stopFade: prefs.stopFade, locked: showLocked,
  };
}
function pushRemoteState(now) {
  if (!remoteActive || now - remoteLastAt < 250) return;
  remoteLastAt = now;
  const st = buildRemoteState(), sig = JSON.stringify(st);
  if (sig === remoteLastSig) return;
  remoteLastSig = sig;
  window.electronAPI.remote.sendState(st);
}
async function refreshRemoteActive() {
  if (!HAS_REMOTE) return null;
  try {
    const cfg = await window.electronAPI.remote.getConfig();
    remoteActive = !!(cfg.enabled && cfg.status?.running);
    remoteLastSig = '';
    return cfg;
  } catch { remoteActive = false; return null; }
}
function initRemoteBridge() {
  if (!HAS_REMOTE) return;
  window.electronAPI.remote.onCommand(handleRemoteCommand);
  refreshRemoteActive();
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); setStatus('Copied'); return; } catch { /* fall through */ }
  const ta = Object.assign(document.createElement('textarea'), { value: text });
  ta.style.cssText = 'position:fixed;top:-200px;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); setStatus('Copied'); } catch { setStatus('Could not copy — select the text and copy it manually'); }
  ta.remove();
}

async function applyRemote() {
  const en = document.getElementById('remoteEnabled'), lan = document.getElementById('remoteLan'), port = document.getElementById('remotePort');
  const cfg = await window.electronAPI.remote.setConfig({ enabled: !!en?.checked, lan: !!en?.checked && !!lan?.checked, port: parseInt(port?.value, 10) });
  await refreshRemoteActive();
  await renderRemoteBox(cfg);
}
async function regenRemoteToken() {
  if (!confirm('Generate a new access token?\n\nEvery phone, Stream Deck or script using the old token will stop working until you give it the new one.')) return;
  await window.electronAPI.remote.regenToken();
  await renderRemoteBox();
}

      <input type="checkbox" id="remoteLan" ${cfg.lan ? 'checked' : ''} ${cfg.enabled ? '' : 'disabled'} onchange="applyRemote()"></label>
    <div class="set-row"><span>Port</span><input class="modal-input" style="width:90px" type="number" id="remotePort" min="1024" max="65535" value="${cfg.port}" onchange="applyRemote()"></div>
    ${statusLine}
    ${st.running ? `<div class="set-sub">Phone / tablet remote — open one of these links (it contains the secret token):</div>
      ${(cfg.urls || []).map((u, i) => `<div class="set-row"><span style="flex:1;min-width:0"><small>${escHtml(u.label)}</small>
        <input class="modal-input" readonly id="remoteUrl${i}" value="${escHtml(u.url)}" onclick="this.select()" style="font-size:11px"></span>

    <div class="set-sub">Access token</div>
