<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The app loads nothing from the network, so nothing remote is allowed. 'unsafe-inline' stays because the
     UI uses inline handlers/styles; the rest of the policy still stops remote scripts, images, frames and
     exfiltration (connect-src) if markup ever slips through. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/256x256.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kostudio Cue">
<meta name="theme-color" content="#0d0d0d">
<title>Kostudio Audio Cue</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d0d0d'/><text x='50' y='68' font-family='Arial Black,sans-serif' font-size='72' font-weight='900' fill='%2300d4ff' text-anchor='middle'>K</text><text x='50' y='88' font-family='Arial,sans-serif' font-size='20' font-weight='300' fill='%23c8c8c8' text-anchor='middle' letter-spacing='5'>cue</text></svg>" type="image/svg+xml">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --surface2: #1c1c1c;
  --border: #303030;
  --text: #ffffff;
  --muted: #909090;
  --accent: #00d4ff;
  --playing: #00ff99;
  --loop-col: #ff9900;
  --danger: #ff3355;
  --save-col: #44cc88;
  --fade-col: #aa66ff;
  --shadow: rgba(0,0,0,.0);
  --stack-w: 282px;
  --footer-h: 38px;
  --header-h: 47px;
  --pads-scale: 1;
  --stack-text-scale: 1;
}

html[data-theme="light"] {
  --bg: #eef2fa;
  --surface: #ffffff;
  --surface2: #e4eaf7;
  --border: #c0ceea;
  --text: #1a2040;
  --muted: #6a7a9e;
  --accent: #1d5fd8;
  --playing: #14a356;
  --loop-col: #d96600;
  --danger: #d42040;
  --save-col: #17996a;
  --fade-col: #7a3fcf;
  --shadow: rgba(0,10,60,.10);
}

html[data-theme="light"] body { background: linear-gradient(160deg,#eef2fa 0%,#e6edf8 100%); }
html[data-theme="light"] .logo { text-shadow: 0 0 22px rgba(29,95,216,.4); }
html[data-theme="light"] header,
html[data-theme="light"] .stack-panel,
html[data-theme="light"] footer { box-shadow: 0 1px 0 var(--border); }
html[data-theme="light"] header { background: linear-gradient(90deg,#ffffff 0%,#f4f7ff 100%); }
html[data-theme="light"] .pad { box-shadow: 0 2px 8px var(--shadow); }
html[data-theme="light"] .pad.loaded { box-shadow: 0 3px 12px var(--shadow); }
html[data-theme="light"] .pad.playing { box-shadow: 0 0 20px var(--c),0 4px 16px var(--shadow); }
html[data-theme="light"] .pad.loaded .pad-tint  { opacity: .05; }
html[data-theme="light"] .pad.playing .pad-tint { opacity: .1; }
html[data-theme="light"] .shortcut-key { background: rgba(29,95,216,.07); }
html[data-theme="light"] .sh-key { background: rgba(29,95,216,.07); }
html[data-theme="light"] kbd { background: rgba(29,95,216,.08); border-color: rgba(29,95,216,.25); color: var(--accent); }
html[data-theme="light"] .stack-item:hover { background: rgba(29,95,216,.05); }
html[data-theme="light"] .stack-item.active { background: rgba(29,95,216,.09); }
html[data-theme="light"] .modal-overlay { background: rgba(0,10,50,.45); }
html[data-theme="light"] .modal-box { box-shadow: 0 24px 64px rgba(0,10,60,.22); }
html[data-theme="light"] .proj-item { box-shadow: 0 1px 4px var(--shadow); }
html[data-theme="light"] .sh-custom-row { box-shadow: 0 1px 4px var(--shadow); }
html[data-theme="light"] .next-btn { background: linear-gradient(135deg,#f0f5ff 0%,#e8eeff 100%); }
html[data-theme="light"] .next-btn:hover:not(:disabled) { background: var(--accent); }
html[data-theme="light"] .pad-prog-fill { opacity: .85; }
html[data-theme="light"] .playing-dot { box-shadow: 0 0 10px var(--playing),0 0 4px var(--playing); }
html[data-theme="light"] .pad-add-tile:hover { background: rgba(29,95,216,.05); }
html[data-theme="light"] .scene-tab.active { border-bottom-color: var(--surface); }
html[data-theme="light"] .pad-vol-slider { background: var(--border); }

.theme-btn {
  padding: 5px 11px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  transition: all .2s;
  line-height: 1;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

#appWrap {
  margin-top: var(--header-h);
  margin-right: var(--stack-w);
  height: calc(100vh - var(--header-h) - var(--footer-h));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── Header ── */
header {
  position: fixed;
  /* Full width: the stack panel starts below the header, so stopping short of it (right: var(--stack-w))
     only squeezed the header — at the 960px minimum window STOP ALL and VOL ended up off-screen. */
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-sizing: border-box;
}
.logo {
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--accent);
  text-shadow: 0 0 30px rgba(0,212,255,.55);
  margin-right: 6px;
  white-space: nowrap;
}
.hdr-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.hdr-btn {
  padding: 5px 13px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
  transition: all .15s;
  white-space: nowrap;
}
.hdr-btn:hover       { border-color: var(--accent); color: var(--accent); }
.hdr-btn.save:hover  { border-color: var(--save-col); color: var(--save-col); }
.header-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
a.hdr-btn { text-decoration: none; display: inline-flex; align-items: center; }
.hdr-btn.donate:hover { border-color: #ff5e5b; color: #ff5e5b; }
.hdr-btn.stopfade { padding: 5px 9px; font-size: 11px; }
.hdr-btn.icon { padding: 5px 9px; font-size: 13px; line-height: 1; }
.hdr-btn.icon.on { border-color: var(--danger); background: rgba(255,60,60,.12); }
.footer-btn { padding: 2px 9px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; font-size: 11px; cursor: pointer; margin-right: 10px; white-space: nowrap; }
.footer-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.footer-btn:disabled { opacity: .35; cursor: default; }
/* Locked show: editing controls are dimmed and inert (the JS guards refuse the actions too) */
body.show-locked .clear-pad, body.show-locked .stack-rm, body.show-locked .stack-mv, body.show-locked .scene-tab-rm,
body.show-locked .scene-add-btn, body.show-locked .pad-add-tile, body.show-locked .clear-btn,
body.show-locked [data-action="color"], body.show-locked [data-action="capture"],
body.show-locked [data-action="set-in"], body.show-locked [data-action="set-out"] { opacity: .25; pointer-events: none; }
.hdr-btn.stopfade.on { border-color: var(--danger); color: var(--danger); background: rgba(255,60,60,.10); }
/* Header compaction. fitHeader() (JS) measures the header and steps through these levels until everything fits —
   so it adapts to the window width, the language (Greek / German labels are longer) and the fonts, not to fixed
   pixel guesses. Least important content goes first, so FADE / VOL / STOP FADE / STOP ALL always stay on screen.
     1: smaller logo, no "Donate" word   2: no logo   3: icon-only buttons, tighter spacing */
header[data-compact="1"] .logo, header[data-compact="2"] .logo, header[data-compact="3"] .logo { font-size: 13px; letter-spacing: 2px; }
header[data-compact="1"] .hdr-btn.donate .lbl, header[data-compact="2"] .hdr-btn.donate .lbl, header[data-compact="3"] .hdr-btn.donate .lbl { display: none; }
header[data-compact="2"] .logo, header[data-compact="2"] .logo + .hdr-sep, header[data-compact="3"] .logo, header[data-compact="3"] .logo + .hdr-sep { display: none; }
header[data-compact="3"] { gap: 6px; padding: 0 12px; }
header[data-compact="3"] .hdr-btn { padding: 5px 10px; }
header[data-compact="3"] .hdr-btn .lbl { display: none; }
header[data-compact="3"] .header-right { gap: 8px; }
.vol-wrap { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
input[type=range] {
  -webkit-appearance: none;
  width: 84px; height: 3px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
.stop-all {
  padding: 5px 13px;
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  transition: all .15s;
  white-space: nowrap;
}
.stop-all:hover { background: var(--danger); color: #fff; }

/* Fade duration control */
.fade-dur-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .5px;
}
.fade-dur-input {
  width: 36px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  padding: 3px 5px;
  font-size: 11px;
  text-align: center;
  outline: none;
  -moz-appearance: textfield;
}
.fade-dur-input::-webkit-inner-spin-button,
.fade-dur-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.fade-dur-input:focus { border-color: var(--fade-col); }

/* ── Main ── */
main {
  flex: 1;
  min-height: 0;
  display: flex;
}
.pads-section { flex: 1; min-height: 0; padding: 14px; overflow-y: auto; }
.pads-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  zoom: var(--pads-scale);
  /* width is set dynamically by JS in updateGridWidth() so that
     css_width × zoom = section content width at every scale level */
}

/* ── Pad ── */
.pad {
  --c: #444;
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  overflow: hidden;
}
.pad-tint {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  background: var(--c);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.pad.loaded .pad-tint  { opacity: .06; }
.pad.playing .pad-tint { opacity: .13; }
.pad.loaded  { border-color: var(--c); }
.pad.playing { border-color: var(--c); box-shadow: 0 0 18px var(--c); }
.pad.drag-over { border-color: var(--accent) !important; box-shadow: 0 0 12px rgba(0,212,255,.4); }

.pad-top {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  position: relative;
  z-index: 1;
}
.pad-name {
  flex: 1;
  font-size: 11.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.4;
}
.pad-name.empty       { color: var(--muted); font-weight: 400; font-style: italic; font-size: 11px; }
.pad-name.needs-audio { color: var(--loop-col); font-weight: 500; font-style: italic; font-size: 11px; }
.pad-name input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--accent);
  color: var(--text);
  font-size: 11.5px;
  font-weight: 600;
  outline: none;
}

/* Color dot */
.color-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  flex-shrink: 0;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.18);
  margin-top: 2px;
  transition: transform .15s, border-color .15s;
}
.color-dot:hover { transform: scale(1.35); border-color: rgba(255,255,255,.5); }

.shortcut-key {
  flex-shrink: 0;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 7px;
  font-family: monospace;
  font-size: 11px;
  font-weight: bold;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.shortcut-key:hover { border-color: var(--accent); color: var(--accent); }
.shortcut-key.capturing { border-color: var(--loop-col); color: var(--loop-col); animation: blink .7s ease-in-out infinite; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Time row */
.pad-time-row {
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
  z-index: 1;
}
.pad-time-row > .pad-progress {
  flex: 1;
  cursor: grab;
}
.pad-time-row > .pad-progress:hover .pad-prog-fill { filter: brightness(1.3); }
.pad-time {
  font-size: 9px;
  font-family: monospace;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 70px;
  text-align: right;
}

.pad-progress {
  height: 10px;
  background: var(--border);
  border-radius: 5px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  overflow: hidden;
  cursor: grab;
  width: 100%;
  touch-action: none;
}
.pad-progress.scrubbing { cursor: grabbing; }
/* Waveform: the bar grows, the canvas sits underneath a translucent "played" fill, IN/OUT markers stay on top */
.pad.has-wave .pad-progress { height: 36px; background: rgba(128,128,128,.14); }
.pad-wave { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; color: var(--text); opacity: .6; }
.pad.has-wave .pad-prog-fill { position: relative; z-index: 1; opacity: .32; border-radius: 0; }
.pad.has-wave .prog-active-zone, .pad.has-wave .prog-in-marker, .pad.has-wave .prog-out-marker { z-index: 2; }
.pad-prog-fill {
  height: 100%;
  background: var(--c);
  border-radius: 5px;
  width: 0%;
  transition: filter .1s;
}
.prog-active-zone {
  position: absolute;
  top: 0; bottom: 0;
  background: rgba(255,255,255,.18);
  pointer-events: none;
  display: none;
}
.prog-in-marker {
  position: absolute;
  top: 0; bottom: 0;
  width: 3px;
  background: #44ff88;
  pointer-events: none;
  display: none;
  box-shadow: 0 0 5px #44ff88;
}
.prog-out-marker {
  position: absolute;
  top: 0; bottom: 0;
  width: 3px;
  background: #ff6644;
  pointer-events: none;
  display: none;
  box-shadow: 0 0 5px #ff6644;
}
html[data-theme="light"] .prog-active-zone { background: rgba(0,0,0,.09); }

/* Vol row */
.pad-vol-row {
  display: flex;
  align-items: center;
  gap: 5px;
  position: relative;
  z-index: 1;
}
.vol-label {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: .5px;
  flex-shrink: 0;
  font-weight: 600;
}
.pad-vol-slider {
  -webkit-appearance: none;
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
  min-width: 0;
}
.pad-vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--c);
  cursor: pointer;
  border: 1px solid rgba(255,255,255,.2);
}
.vol-pct {
  font-size: 9px;
  font-family: monospace;
  color: var(--muted);
  flex-shrink: 0;
  min-width: 26px;
  text-align: right;
}

.pad-footer {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: auto;
  position: relative;
  z-index: 1;
}
.btn-sm {
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn-sm:hover            { border-color: var(--accent); color: var(--accent); }
.btn-sm.loop-on          { border-color: var(--loop-col); color: var(--loop-col); background: rgba(255,153,0,.08); }
.btn-sm.fade-on          { border-color: var(--fade-col); color: var(--fade-col); background: rgba(170,102,255,.08); }
.btn-sm.stack-btn        { margin-left: auto; }
.btn-sm.play-stop        { min-width: 46px; }
.btn-sm.play-stop:hover  { border-color: var(--accent); color: var(--accent); }
.btn-sm.is-playing       { border-color: var(--danger); color: var(--danger); background: rgba(255,51,85,.08); }
.btn-sm.is-playing:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-sm.clear-pad        { padding: 3px 6px; }
.btn-sm.clear-pad:hover  { border-color: var(--danger); color: var(--danger); }

.pad-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 11px;
  pointer-events: none;
}
.playing-dot {
  position: absolute;
  top: 9px; right: 9px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--playing);
  box-shadow: 0 0 8px var(--playing);
  animation: pulse 1s ease-in-out infinite;
  z-index: 2;
  transition: background .3s, box-shadow .3s;
}
.pad.fading .playing-dot {
  background: var(--loop-col);
  box-shadow: 0 0 8px var(--loop-col);
}
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.65} }

/* ── Stack panel ── */
.stack-panel {
  position: fixed;
  right: 0;
  top: var(--header-h);
  bottom: var(--footer-h);
  width: var(--stack-w);
  z-index: 10;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.stack-list, .stack-foot {
  zoom: var(--stack-text-scale);
}
.stack-head {
  padding: 8px 10px 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.stack-scale-wrap {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-left: auto;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 2px 6px;
}
.stack-scale-val {
  font-family: monospace;
  font-size: 10px;
  font-weight: 600;
  color: var(--text);
  min-width: 30px;
  text-align: center;
}
.stack-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}
.clear-btn {
  margin-left: auto;
  padding: 3px 10px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  transition: all .15s;
}
.clear-btn:hover { border-color: var(--danger); color: var(--danger); }

/* Scene tabs */
.scene-tabs-wrap {
  padding: 6px 8px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  gap: 3px;
  flex-wrap: nowrap;
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.scene-tabs-wrap::-webkit-scrollbar { display: none; }
.scene-tab {
  position: relative;
  padding: 4px 9px;
  border-radius: 4px 4px 0 0;
  border: 1px solid transparent;
  border-bottom: none;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  color: var(--muted);
  transition: all .12s;
  flex-shrink: 0;
  line-height: 1.4;
}
.scene-tab:hover { color: var(--text); border-color: var(--border); }
.scene-tab.active {
  color: var(--accent);
  border-color: var(--border);
  border-bottom-color: var(--surface);
  background: var(--surface);
  margin-bottom: -1px;
}
.scene-tab-rm {
  display: none;
  position: absolute;
  top: -5px; right: -5px;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--danger);
  color: #fff;
  font-size: 9px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  line-height: 1;
  z-index: 2;
}
.scene-tab:hover .scene-tab-rm { display: flex; }
.scene-add-btn {
  flex-shrink: 0;
  width: 20px; height: 20px;
  margin-bottom: 2px;
  border-radius: 4px;
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
  line-height: 1;
}
.scene-add-btn:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }

.stack-list { flex: 1; overflow-y: auto; padding: 8px; }
.stack-empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.8;
}
.stack-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 5px;
  border: 1px solid transparent;
  margin-bottom: 3px;
  cursor: pointer;
  transition: all .12s;
}
.stack-item:hover       { background: rgba(255,255,255,.04); border-color: var(--border); }
.stack-item.active      { border-color: var(--accent); background: rgba(0,212,255,.07); }
.stack-n   { width: 18px; font-size: 10px; color: var(--muted); text-align: right; flex-shrink: 0; }
.stack-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.stack-lbl { flex: 1; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack-time { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 30px; text-align: right; }
.stack-item.no-audio { opacity: .6; }
.stack-item.no-audio .stack-time { color: var(--loop-col); }
.stack-item.drop-before { box-shadow: 0 -2px 0 0 var(--accent); }
.stack-item.drop-after  { box-shadow: 0  2px 0 0 var(--accent); }
.stack-mv  { opacity: 0; color: var(--muted); cursor: pointer; font-size: 9px; line-height: 1; padding: 2px 2px; flex-shrink: 0; transition: all .12s; }
.stack-item:hover .stack-mv { opacity: 1; }
.stack-mv:hover { color: var(--accent); }
@media (pointer: coarse) { .stack-mv { opacity: 1; font-size: 13px; padding: 8px 6px; } .stack-rm { opacity: 1; } }
.stack-rm  { opacity: 0; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; transition: all .12s; }
.stack-item:hover .stack-rm { opacity: 1; }
.stack-rm:hover { color: var(--danger); }

.stack-foot {
  flex-shrink: 0;
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.auto-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.auto-row span { font-size: 11.5px; color: var(--muted); }
.toggle-sw {
  width: 32px; height: 17px;
  background: var(--border);
  border-radius: 9px;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
}
.toggle-sw.on { background: var(--accent); }
.toggle-sw::after {
  content: '';
  position: absolute;
  width: 13px; height: 13px;
  background: #fff;
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: left .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.toggle-sw.on::after { left: 17px; }
.play-cue-btn {
  width: 100%;
  padding: 11px 10px;
  background: var(--surface2);
  border: 1px solid var(--playing);
  color: var(--playing);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  transition: all .15s;
}
.play-cue-btn:hover:not(:disabled) { background: var(--playing); color: #000; }
.play-cue-btn:disabled { opacity: .3; cursor: default; }
.play-cue-btn.is-playing { border-color: var(--danger); color: var(--danger); }
.play-cue-btn.is-playing:hover:not(:disabled) { background: var(--danger); color: #fff; }
html[data-theme="light"] .play-cue-btn:hover:not(:disabled) { color: #fff; }
html[data-theme="light"] .play-cue-btn.is-playing:hover:not(:disabled) { color: #fff; }

.next-btn {
  width: 100%;
  padding: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--accent);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  transition: all .15s;
}
.next-btn:hover:not(:disabled) { background: var(--accent); color: #000; border-color: var(--accent); }
.next-btn:disabled { opacity: .3; cursor: default; }

/* ── Footer ── */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: var(--stack-w);
  height: var(--footer-h);
  z-index: 100;
  padding: 0 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 10.5px;
  color: var(--muted);
}
.footer-status { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scale-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 8px;
  flex-shrink: 0;
}
.scale-btn {
  width: 18px; height: 18px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}
.scale-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.07); }
.scale-val { font-family: monospace; font-size: 11px; font-weight: 600; color: var(--text); min-width: 34px; text-align: center; }
.scale-lbl { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin-right: 2px; }
.status-txt { color: var(--text); opacity: .7; }
.tips { display: flex; gap: 14px; }
.tip { display: flex; align-items: center; gap: 4px; }
kbd {
  background: rgba(255,255,255,.08);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 4px;
  font-family: monospace;
  font-size: 10px;
}

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.82);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  backdrop-filter: blur(3px);
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 400px;
  max-width: 92vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
}
.modal-hdr {
  padding: 15px 18px 13px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.modal-title { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
.modal-x { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 2px; transition: color .15s; }
.modal-x:hover { color: var(--text); }
.modal-box.wide { width: 560px; }
.modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
.set-sec { margin-bottom: 18px; }
.set-hdr { font-size: 10.5px; color: var(--accent); letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 12.5px; }
.set-row small { color: var(--muted); font-size: 10.5px; line-height: 1.5; }
.set-warn { color: var(--danger); font-size: 11.5px; min-height: 0; }
.set-warn:empty { display: none; }
.set-ok { color: #1a9a4a; font-size: 12px; padding: 3px 0; }
.set-sub { font-size: 11px; color: var(--muted); margin: 10px 0 2px; }
.set-sec code { font-size: 10.5px; background: var(--surface); padding: 1px 4px; border-radius: 3px; user-select: text; }
.midi-map { max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; margin: 4px 0; }
.chk-run { text-align: center; color: var(--muted); padding: 24px 0; font-size: 12.5px; }
.chk-verdict { font-size: 18px; font-weight: 800; letter-spacing: 2px; padding: 12px 14px; border-radius: 8px; text-align: center; margin-bottom: 10px; }
.chk-verdict.good { color: #1a9a4a; background: rgba(40,200,90,.12); border: 1px solid rgba(40,200,90,.4); }
.chk-verdict.warn { color: #b8860b; background: rgba(255,190,0,.12); border: 1px solid rgba(255,190,0,.45); }
.chk-verdict.bad  { color: var(--danger); background: rgba(255,60,60,.10); border: 1px solid rgba(255,60,60,.45); }
.chk-sum { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 12px; }
.chk-list { display: flex; flex-direction: column; gap: 5px; }
.chk-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; line-height: 1.45; }
.chk-item.fail { border-color: rgba(255,60,60,.5); background: rgba(255,60,60,.06); }
.chk-item.warn { border-color: rgba(255,190,0,.5); background: rgba(255,190,0,.06); }
.chk-ic { font-weight: 800; width: 16px; text-align: center; flex-shrink: 0; }
.chk-item.fail .chk-ic { color: var(--danger); } .chk-item.warn .chk-ic { color: #b8860b; } .chk-item.info .chk-ic { color: var(--muted); }
.chk-tx { flex: 1; word-break: break-word; }
.chk-go { padding: 3px 10px; font-size: 11px; flex-shrink: 0; }
.pad.flash { animation: padflash .6s ease-in-out 3; }
@keyframes padflash { 50% { box-shadow: 0 0 0 4px var(--accent), 0 0 24px var(--accent); } }
.modal-ftr { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; }
.modal-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 5px;
  padding: 8px 11px;
  font-size: 13px;
  outline: none;
  transition: border-color .15s;
  user-select: text;
}
.modal-input:focus { border-color: var(--accent); }
.modal-label { display: block; font-size: 10.5px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 7px; }
.modal-btn {
  padding: 7px 18px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
  transition: all .15s;
}
.modal-btn:hover         { border-color: var(--accent); color: var(--accent); }
.modal-btn.primary       { border-color: var(--accent); color: var(--accent); }
.modal-btn.primary:hover { background: var(--accent); color: #000; }
.modal-btn.save-ok       { border-color: var(--save-col); color: var(--save-col); }
.modal-btn.save-ok:hover { background: var(--save-col); color: #000; }

.proj-list { display: flex; flex-direction: column; gap: 5px; }
.proj-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: all .12s;
}
.proj-item:hover { border-color: var(--accent); }
.proj-meta { flex: 1; min-width: 0; }
.proj-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-date { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.proj-del  { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 3px; line-height: 1; transition: color .12s; flex-shrink: 0; }
.proj-del:hover { color: var(--danger); }
.proj-empty { text-align: center; padding: 28px 0; color: var(--muted); font-size: 12px; line-height: 1.8; }

/* ── Add Cue tile ── */
.pad-add-tile {
  border: 2px dashed var(--border);
  border-radius: 8px;
  min-height: 130px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px;
  cursor: pointer;
  color: var(--muted);
  transition: all .2s;
  background: transparent;
}
.pad-add-tile:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.04); transform: scale(1.02); }
.pad-add-tile .add-icon  { font-size: 28px; line-height: 1; font-weight: 300; }
.pad-add-tile .add-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }

/* ── Shortcuts Modal ── */
.sh-sec-hdr { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 14px 0 7px; display: flex; align-items: center; gap: 8px; }
.sh-sec-hdr:first-child { margin-top: 0; }
.sh-hint { font-size: 9.5px; font-weight: 400; letter-spacing: 0; text-transform: none; opacity: .6; }
.sh-pad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.sh-pad-row { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 5px; border: 1px solid transparent; transition: border-color .12s; }
.sh-pad-row:hover { border-color: var(--border); background: rgba(255,255,255,.02); }
.sh-key {
  flex-shrink: 0;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 7px;
  font-family: monospace;
  font-size: 11px;
  font-weight: bold;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  min-width: 34px;
  text-align: center;
}
.sh-key:hover       { border-color: var(--accent); color: var(--accent); }
.sh-key.capturing   { border-color: var(--loop-col); color: var(--loop-col); animation: blink .7s ease-in-out infinite; }
.sh-key.combo       { cursor: default; min-width: auto; }
.sh-key.combo:hover { border-color: var(--border); color: var(--muted); }
.sh-pad-name       { flex: 1; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-pad-name.empty { color: var(--muted); font-style: italic; }
.sh-custom-list { display: flex; flex-direction: column; gap: 3px; min-height: 10px; }
.sh-custom-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); }
.sh-actions { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
.sh-test, .sh-del { background: none; border: 1px solid var(--border); border-radius: 3px; color: var(--muted); cursor: pointer; font-size: 11px; padding: 2px 7px; transition: all .12s; line-height: 1.4; }
.sh-test:hover { border-color: var(--accent); color: var(--accent); }
.sh-del:hover  { border-color: var(--danger);  color: var(--danger); }
.sh-add-btn { width: 100%; margin-top: 6px; padding: 7px; background: transparent; border: 1px dashed var(--border); color: var(--muted); border-radius: 5px; cursor: pointer; font-size: 11.5px; transition: all .15s; }
.sh-add-btn:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
.sh-add-form { display: flex; flex-direction: column; gap: 9px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-top: 6px; }
.sh-add-row   { display: flex; align-items: center; gap: 8px; }
.sh-add-label { font-size: 10.5px; color: var(--muted); width: 42px; flex-shrink: 0; }
.sh-select { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 4px 8px; font-size: 12px; outline: none; cursor: pointer; }
.sh-select:focus { border-color: var(--accent); }
.sh-form-btns { display: flex; gap: 6px; justify-content: flex-end; }
.sh-empty-msg { font-size: 11.5px; color: var(--muted); padding: 8px 0; font-style: italic; }

/* ── Transport Controls ── */
.pad-transport {
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
  z-index: 1;
}
.transport-pp {
  flex: 1;
  height: 36px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .8px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.transport-pp .t-icon { font-size: 13px; line-height: 1; }
.transport-pp:hover { border-color: var(--c); color: var(--c); background: rgba(255,255,255,.08); }
.transport-pp.is-playing {
  background: var(--c);
  border-color: var(--c);
  color: #000;
}
.transport-pp.is-paused {
  border-color: var(--c);
  color: var(--c);
  background: rgba(255,255,255,.04);
}
.transport-stop {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.transport-stop:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,51,85,.08); }
html[data-theme="light"] .transport-pp.is-playing { color: #fff; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── In/Out row ── */
.inout-row {
  display: flex;
  align-items: center;
  gap: 4px;
  position: relative;
  z-index: 1;
}
.inout-btn {
  font-size: 9px;
  font-family: monospace;
  font-weight: 700;
  letter-spacing: .3px;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1.5;
}
.inout-btn:hover { border-color: var(--c); color: var(--c); }
.inout-btn.set   { border-color: var(--c); color: var(--c); background: rgba(255,255,255,.05); }
html[data-theme="light"] .inout-btn.set { background: rgba(0,0,0,.04); }
.inout-spacer { flex: 1; height: 1px; background: var(--border); margin: 0 2px; opacity: .5; }

/* ── Pad left-column layout ── */
.pad-inner {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.pad-left-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding-top: 2px;
  flex-shrink: 0;
  width: 22px;
  position: relative;
  z-index: 1;
}
.pad-left-col::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  right: -4px;
  width: 1px;
  background: var(--c);
  opacity: .2;
}
.pad-right-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: relative;
  z-index: 1;
}

/* header light-mode tweak */
html[data-theme="light"] header { background: linear-gradient(90deg,#ffffff 0%,#f4f7ff 100%); }

/* ── Update banner ── */
#updateBanner {
  position: fixed;
  bottom: var(--footer-h);
  left: 0;
  right: var(--stack-w);
  z-index: 500;
  background: var(--surface2);
  border-top: 1px solid var(--accent);
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11.5px;
  transform: translateY(calc(100% + var(--footer-h)));
  transition: transform .3s ease;
  pointer-events: none;
}
#updateBanner.visible {
  transform: translateY(0);
  pointer-events: auto;
}
.upd-icon { font-size: 14px; flex-shrink: 0; }
.upd-label { flex: 1; color: var(--text); }
.upd-bar-wrap {
  width: 120px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}
.upd-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  transition: width .3s;
}
.upd-pct { font-family: monospace; font-size: 10px; color: var(--muted); min-width: 32px; text-align: right; flex-shrink: 0; }
.upd-dismiss {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-size: 11px;
  padding: 2px 9px;
  cursor: pointer;
  transition: all .12s;
  flex-shrink: 0;
}
.upd-dismiss:hover { border-color: var(--accent); color: var(--accent); }
.upd-success { border-top-color: var(--save-col); }
.upd-success .upd-bar-fill { background: var(--save-col); }

/* ═══════════════════════════════════════════════════════════
   TOUCH / iPAD LAYOUT
   Activated by (pointer: coarse) — stylus / touch screens
═══════════════════════════════════════════════════════════ */

/* Stack drawer handle — hidden on desktop */
.stack-handle {
  display: none;
  justify-content: center;
  align-items: center;
  height: 26px;
  flex-shrink: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.stack-handle-pip {
  width: 40px; height: 5px;
  background: var(--border);
  border-radius: 3px;
  opacity: .55;
  transition: opacity .15s, background .15s;
}
.stack-panel.collapsed .stack-handle-pip { opacity: 1; background: var(--accent); }

/* Safe-area insets for iPhone/iPad notch & home bar */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  .stack-panel { padding-bottom: env(safe-area-inset-bottom); }
}

@media (pointer: coarse) {

  /* --- Global: remove right margin for stack --- */
  :root { --stack-w: 0px; }

  /* --- Eliminate 300ms tap delay and grey flash on all interactive elements --- */
  button, .pad, .pad-add-tile, .hdr-btn, .theme-btn, .stop-all,
  .stack-handle, .stack-item, .scene-tab, .modal-btn, .clear-btn,
  .scale-btn, .inout-btn, .transport-pp, .transport-stop,
  .btn-sm, .color-dot, .shortcut-key, .prog-bar, .pad-progress,
  [data-action] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  /* Remove tap highlight from pad container too */
  .pad, .pad-add-tile { -webkit-tap-highlight-color: transparent; }

  /* --- Header: full width, horizontal scroll --- */
  header {
    right: 0;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 8px;
    padding: 0 14px;
  }
  header::-webkit-scrollbar { display: none; }
  .header-right { gap: 8px; }

  /* --- Bigger touch targets --- */
  .hdr-btn, .theme-btn {
    padding: 7px 13px;
    min-height: 40px;
    font-size: 13px;
  }
  .stop-all { padding: 7px 13px; min-height: 40px; }

  /* --- Footer: hidden on touch (scale via pinch or auto) --- */
  footer { display: none; }

  /* --- App wrapper: shrink to leave room for bottom stack sheet --- */
  #appWrap {
    margin-right: 0;
    height: calc(100dvh - var(--header-h) - var(--stack-sheet-h, 300px));
  }

  /* --- Stack panel: fixed bottom sheet --- */
  .stack-panel {
    position: fixed;
    left: 0; right: 0;
    bottom: 0; top: auto;
    width: 100%;
    height: var(--stack-sheet-h, 300px);
    border: none;
    border-top: 2px solid var(--border);
    border-radius: 16px 16px 0 0;
    transition: height 0.28s cubic-bezier(.4,0,.2,1);
    z-index: 50;
  }

  /* --- Show the handle --- */
  .stack-handle { display: flex; }

  /* --- Collapsed: only handle + foot buttons --- */
  .stack-panel.collapsed .stack-head,
  .stack-panel.collapsed .scene-tabs-wrap,
  .stack-panel.collapsed .stack-list,
  .stack-panel.collapsed .auto-row { display: none; }

  /* --- Stack foot: buttons side by side on touch --- */
  .stack-foot {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  .auto-row { flex-basis: 100%; order: 1; }
  .play-cue-btn { flex: 1; min-width: 0; order: 2; padding: 14px 8px; font-size: 14px; }
  .next-btn     { flex: 1; min-width: 0; order: 3; padding: 14px 8px; font-size: 14px; }

  /* --- Pads: 3 columns default, no keyboard badges --- */
  .pads-grid { grid-template-columns: repeat(3, 1fr); }
  .shortcut-key { display: none; }

  /* --- Scrubber: taller hit area for finger --- */
  .prog-bar { min-height: 14px !important; }

  /* --- Pad buttons: taller --- */
  .pad-btn { min-height: 34px !important; }
}

/* iPad landscape / large tablet: 4 columns */
@media (pointer: coarse) and (min-width: 900px) {
  .pads-grid { grid-template-columns: repeat(4, 1fr); }
}

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────
const COLORS = [
  '#00d4ff','#ff6b35','#ff3388','#44ff88',
  '#ffcc00','#9966ff','#ff4444','#00ccaa',
  '#ff99cc','#66aaff','#ffaa44','#88ee44'
];
const DEFAULT_KEYS = ['1','2','3','4','5','6','7','8','q','w','e','r'];

// ── State ─────────────────────────────────────────────────
let pads = DEFAULT_KEYS.map((key, i) => ({
  id: i, key,
  color:       COLORS[i % COLORS.length],
  name:        '',
  file:        null,
  audio:       null,
  filePath:    null,
  loop:        false,
  playing:     false,
  paused:      false,
  vol:         1.0,
  fadeEnabled: false,
  inPoint:     null,
  outPoint:    null,
}));

let scenes          = [{ id: 0, name: 'Scene 1', stack: [], stackIdx: -1 }];
let sceneIdSeq      = 1;
let currentSceneIdx = 0;

let autoAdv         = false;
let masterVol       = 1.0;
let fadeDuration    = 2;
let padsScale       = 1.0;
let stackScale      = 1.0;
let capturing       = null;
let db              = null;
let customShortcuts = [];
let shortcutIdSeq   = 0;
let capturingHotkey = false;
let pendingCombo    = null;

// Per-machine preferences. Deliberately NOT part of project files: they describe how *this* operator /
// computer works (output device ids are machine-specific), not the show content.
const PREF_KEY = 'cue-prefs';
const prefs = {
  stopFade: false,     // STOP ALL and the pad ■ button fade out over the FADE time instead of cutting
  waveform: false,     // draw waveforms behind the pad progress bar (set on first run: on for desktop)
  outputId: '',        // audio output device id ('' = system default)
  lang: '',            // '' = follow the browser / OS language
  midiEnabled: false,  // listen to MIDI controllers (Chromium / Electron only)
  midiMap: [],         // [{ msg:'note'|'cc', ch:-1..15, num:0..127, cmd:{…remote command…} }]
};
function loadPrefs() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch {}
  if (typeof saved !== 'object') saved = {};
  prefs.stopFade = saved.stopFade === true;
  prefs.waveform = typeof saved.waveform === 'boolean' ? saved.waveform : !IS_TOUCH;
  prefs.outputId = typeof saved.outputId === 'string' ? saved.outputId.slice(0, 300) : '';
  prefs.lang     = typeof saved.lang === 'string' ? saved.lang.slice(0, 8) : '';
  prefs.midiEnabled = saved.midiEnabled === true;
  prefs.midiMap  = sanitizeMidiMap(saved.midiMap);
}
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch {} }

// ── Translations ──────────────────────────────────────────
// The English text in the source IS the key: nothing at the call sites changes. A small engine translates strings
// where they reach the screen — text nodes, title / placeholder / aria-label attributes (via a MutationObserver, so
// dynamically built HTML is covered too) — and wraps confirm(). Keys may contain {0} {1}… placeholders for values
// (so "Loaded "{0}"" matches Loaded "kick.wav" and hands "kick.wav" to the translation). Anything without a
// translation simply stays English. User-typed text (pad / scene / project names…) sits inside [data-notr] and is
// never translated. The tests check every language has every key with matching placeholders.
const I18N = {};                       // filled below: I18N.el = { 'English text': 'translation', … }
const LANGS = { en: 'English', el: 'Ελληνικά', de: 'Deutsch' };
let LANG = 'en';
const trCache = new Map();
const trOrig  = new WeakMap();         // text node -> the English it came from     (so a language switch can re-translate)
const trOut   = new WeakMap();         // text node -> the translation we wrote      (so the observer ignores our own writes)
const trAttr  = new WeakMap();         // element   -> { attr: English }
const TR_ATTRS = ['title', 'placeholder', 'aria-label'];
let trPatterns = [];                   // compiled once per language: [{ re, order, tpl }]

function detectLang() {
  const want = (prefs.lang || (navigator.language || 'en')).toLowerCase();
  const code = Object.keys(LANGS).find(c => want === c || want.startsWith(c + '-')) || 'en';
  return code;
}
function compileTemplate(key) {
  const parts = key.split(/\{(\d+)(!?)\}/);       // text, idx, bang, text, idx, bang, … , text   ({0!} = translate the captured value too)
  let src = '^'; const order = [], deep = [];
  for (let i = 0; i < parts.length; i += 3) {
    src += parts[i].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (i + 1 < parts.length) { src += '([\\s\\S]*?)'; order.push(+parts[i + 1]); deep.push(parts[i + 2] === '!'); }
  }
  return { re: new RegExp(src + '$'), order, deep };
}
function buildTranslator() {
  trCache.clear();
  trPatterns = [];
  const dict = I18N[LANG];
  if (!dict) return;
  for (const [key, tpl] of Object.entries(dict)) if (/\{\d+!?\}/.test(key)) trPatterns.push({ ...compileTemplate(key), tpl });
  trPatterns.sort((a, b) => b.re.source.length - a.re.source.length);   // most specific first
}
// Translate one string (already trimmed). Returns the input unchanged if there is no translation.
function tr(text) {
  if (LANG === 'en' || !text) { if (window.__trSeen && text) window.__trSeen.add(text); return text; }
  if (trCache.has(text)) return trCache.get(text);
  const dict = I18N[LANG] || {};
  let out = Object.prototype.hasOwnProperty.call(dict, text) ? dict[text] : null;
  if (out === null) {
    for (const p of trPatterns) {
      const m = p.re.exec(text);
      if (m) { out = p.tpl.replace(/\{(\d+)!?\}/g, (_, n) => { const i = p.order.indexOf(+n); return i < 0 ? '' : p.deep[i] ? tr(m[i + 1]) : m[i + 1]; }); break; }
    }
  }
  if (out === null) { out = text; if (window.__trSeen) window.__trSeen.add(text); if (window.__trMissing) window.__trMissing.add(text); }
  else if (window.__trSeen) window.__trSeen.add(text);
  if (trCache.size > 5000) trCache.clear();
  trCache.set(text, out);
  return out;
}
const trPad = s => { const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s); return m[2] ? m[1] + tr(m[2]) + m[3] : s; };
const trSkip = n => !!n.parentElement?.closest('[data-notr], script, style, textarea, input');

function translateTextNode(n) {
  if (trSkip(n)) return;
  const cur = n.nodeValue;
  if (trOut.get(n) === cur) return;                           // our own write
  trOrig.set(n, cur);
  const out = trPad(cur);
  if (out !== cur) { trOut.set(n, out); n.nodeValue = out; } else trOut.delete(n);
}
function translateAttrs(el) {
  let rec = trAttr.get(el);
  for (const a of TR_ATTRS) {
    const v = el.getAttribute?.(a);
    if (!v) continue;
    if (rec?.[a] && rec[a].out === v) continue;             // our own write
    const out = trPad(v);
    (rec = rec || {})[a] = { en: v, out };
    if (out !== v) el.setAttribute(a, out);
  }
  if (rec) trAttr.set(el, rec);
}
function translateTree(root) {
  if (root.nodeType === 3) { translateTextNode(root); return; }
  if (root.nodeType !== 1) return;
  translateAttrs(root);
  root.querySelectorAll?.('[title],[placeholder],[aria-label]').forEach(translateAttrs);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) translateTextNode(n);
}
// Re-translate everything from the stored English (used when the language changes).
function retranslateAll() {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) {
    if (trSkip(n)) continue;
    const en = trOrig.has(n) && trOut.get(n) === n.nodeValue ? trOrig.get(n) : n.nodeValue;
    trOrig.set(n, en);
    const out = trPad(en);
    if (out !== n.nodeValue) { trOut.set(n, out); n.nodeValue = out; }
  }
  document.querySelectorAll('[title],[placeholder],[aria-label]').forEach(el => {
    const rec = trAttr.get(el) || {};
    for (const a of TR_ATTRS) {
      const cur = el.getAttribute(a);
      if (!cur) continue;
      const en = rec[a] && rec[a].out === cur ? rec[a].en : cur;
      const out = trPad(en);
      rec[a] = { en, out };
      if (out !== cur) el.setAttribute(a, out);
    }
    trAttr.set(el, rec);
  });
}
function setLanguage(code, remember = true) {
  if (remember) { prefs.lang = code === 'auto' ? '' : code; savePrefs(); }
  LANG = detectLang();
  document.documentElement.lang = LANG;
  buildTranslator();
  retranslateAll();
  fitHeader();                                                  // labels change length with the language
}
function initI18n() {
  LANG = detectLang();
  document.documentElement.lang = LANG;
  buildTranslator();
  new MutationObserver(muts => {
    for (const m of muts) {
      if (m.type === 'childList') m.addedNodes.forEach(translateTree);
      else if (m.type === 'characterData') translateTextNode(m.target);
      else if (m.type === 'attributes') translateAttrs(m.target);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: TR_ATTRS });
  translateTree(document.body);
}
// confirm() text is composed at the call site — translate it on the way out
const _nativeConfirm = window.confirm.bind(window);
window.confirm = msg => _nativeConfirm(String(msg).split('\n').map(l => trPad(l)).join('\n'));

// Translation table: [English (the key), Greek, German]. {0} {1}… are values; {0!} = "translate this value too".
// Control-surface terms (STOP ALL, STOP FADE, FADE, VOL, IN, OUT, LOOP, PLAY, PAUSE, RESUME, KEY, SPACE, ESC, MIDI) stay English on purpose.
const I18N_TABLE = [
  // ── header / chrome
  ['💾 Save', '💾 Αποθήκευση', '💾 Speichern'],
  ['Save', 'Αποθήκευση', 'Speichern'],
  ['Save As', 'Αποθήκευση ως', 'Speichern unter'],
  ['Save As…', 'Αποθήκευση ως…', 'Speichern unter…'],
  ['Load', 'Άνοιγμα', 'Laden'],
  ['Load a project', 'Άνοιγμα έργου', 'Projekt laden'],
  ['Shortcuts', 'Συντομεύσεις', 'Tastenkürzel'],
  ['Keyboard shortcuts', 'Συντομεύσεις πληκτρολογίου', 'Tastaturkürzel'],
  ['Settings: theme, language, audio output, waveforms, remote control, MIDI', 'Ρυθμίσεις: θέμα, γλώσσα, έξοδος ήχου, κυματομορφές, τηλεχειρισμός, MIDI', 'Einstellungen: Design, Sprache, Audioausgang, Wellenformen, Fernsteuerung, MIDI'],
  ['Pre-show check: verifies every sound, cue and setting before doors open', 'Έλεγχος πριν την παράσταση: επαληθεύει κάθε ήχο, cue και ρύθμιση πριν ανοίξουν οι πόρτες', 'Vorab-Check: prüft jeden Sound, jede Cue und jede Einstellung, bevor das Publikum kommt'],
  ['Lock the show (Ctrl+Shift+L): disables editing, loading and deleting so nothing can be changed by accident. Playback still works.', 'Κλείδωμα παράστασης (Ctrl+Shift+L): απενεργοποιεί την επεξεργασία, το άνοιγμα και τη διαγραφή ώστε να μην αλλάξει κάτι κατά λάθος. Η αναπαραγωγή συνεχίζει κανονικά.', 'Show sperren (Strg+Umschalt+L): deaktiviert Bearbeiten, Laden und Löschen, damit nichts versehentlich verändert wird. Die Wiedergabe funktioniert weiter.'],
  ['Donate', 'Δωρεά', 'Spenden'],
  ['Kostudio Audio Cue is free — support development on Ko-fi', 'Το Kostudio Audio Cue είναι δωρεάν — στηρίξτε την ανάπτυξη στο Ko-fi', 'Kostudio Audio Cue ist kostenlos — unterstütze die Entwicklung auf Ko-fi'],
  ['Fade duration (seconds)', 'Διάρκεια fade (δευτερόλεπτα)', 'Fade-Dauer (Sekunden)'],
  ['When on, STOP ALL and the ■ buttons fade out over the FADE time instead of cutting. Escape always cuts instantly.', 'Όταν είναι ενεργό, το STOP ALL και τα κουμπιά ■ κάνουν fade out στη διάρκεια FADE αντί να κόβουν αμέσως. Το Escape κόβει πάντα αμέσως.', 'Wenn aktiv, blenden STOP ALL und die ■-Tasten über die FADE-Zeit aus, statt sofort zu stoppen. Escape stoppt immer sofort.'],
  ['Stop everything (Esc = instant cut)', 'Διακοπή όλων (Esc = άμεσο κόψιμο)', 'Alles stoppen (Esc = sofort abbrechen)'],
  ['Pad volume: {0}%', 'Ένταση pad: {0}%', 'Pad-Lautstärke: {0}%'],
  ['Downloading update…', 'Λήψη ενημέρωσης…', 'Update wird heruntergeladen…'],
  ['↶ Undo', '↶ Αναίρεση', '↶ Rückgängig'],
  ['Nothing to undo', 'Τίποτα προς αναίρεση', 'Nichts zum Rückgängigmachen'],
  ['Undo: {0!} (Ctrl+Z)', 'Αναίρεση: {0!} (Ctrl+Z)', 'Rückgängig: {0!} (Strg+Z)'],
  ['Click a pad or drop an audio file to load', 'Κάντε κλικ σε ένα pad ή σύρετε ένα αρχείο ήχου για φόρτωση', 'Klicke auf ein Pad oder ziehe eine Audiodatei hinein'],
  ['Zoom out pads', 'Σμίκρυνση pads', 'Pads verkleinern'],
  ['Zoom in pads', 'Μεγέθυνση pads', 'Pads vergrößern'],
  ['KEY', 'ΠΛΗΚΤΡΟ', 'TASTE'],
  ['play', 'αναπαραγωγή', 'abspielen'],
  ['next', 'επόμενο', 'weiter'],
  ['stop all', 'διακοπή όλων', 'alles stoppen'],

// ── Undo ──────────────────────────────────────────────────
// Snapshot-based undo for the actions that destroy work: clear pad, replace a pad's sound, remove a cue,
// clear the stack, delete a scene. Each entry keeps enough to rebuild what was lost (File objects stay in memory).
const undoStack = [];
const UNDO_MAX  = 30;
const UNDO_MAX_BYTES = 300 * 1024 * 1024;   // audio kept alive for undo (in Electron it lives in memory) is capped
function pushUndo(label, restore, bytes = 0) {
  undoStack.push({ label, restore, bytes });
  let total = undoStack.reduce((n, u) => n + u.bytes, 0);
  while (undoStack.length > UNDO_MAX || (total > UNDO_MAX_BYTES && undoStack.length > 1)) total -= undoStack.shift().bytes;
  refreshUndoBtn();
}
function undo() {
  if (lockedOut()) return;
  const u = undoStack.pop();
  if (!u) { setStatus('Nothing to undo'); return; }
  try { u.restore(); setStatus(`Undid: ${u.label}`); }
  catch (e) { console.error('undo', e); setStatus(`Could not undo "${u.label}"`); }
  refreshUndoBtn();
  scheduleAutosave();
}
function refreshUndoBtn() {
  const b = document.getElementById('undoBtn');
  if (!b) return;
  const top = undoStack[undoStack.length - 1];
  b.disabled = !top || showLocked;
  b.title = top ? `Undo: ${top.label} (Ctrl+Z)` : 'Nothing to undo';
}
function snapshotPad(pad) {
  return { name: pad.name, file: pad.file, filePath: pad.filePath, missingPath: pad.missingPath, loop: pad.loop, vol: pad.vol,
           fadeEnabled: pad.fadeEnabled, inPoint: pad.inPoint, outPoint: pad.outPoint };
}
function restorePad(pad, snap) {
  clearFadeTimer(pad.id);
  Object.assign(pad, { name: snap.name, loop: snap.loop, vol: snap.vol, fadeEnabled: snap.fadeEnabled, inPoint: snap.inPoint, outPoint: snap.outPoint,
                       playing: false, paused: false, stopping: false });
  if (snap.file) attachAudio(pad, snap.file); else { releaseAudio(pad); pad.file = null; }
  pad.filePath = snap.filePath;
  pad.missingPath = snap.missingPath;
  syncLoopFlag(pad);
  refreshPad(pad.id);
}
// Stacks are snapshotted per scene object, so a restore still works if other scenes were added/removed meanwhile
function snapshotStacks() { return scenes.map(sc => ({ sc, stack: [...sc.stack], stackIdx: sc.stackIdx })); }
function restoreStacks(snaps) {
  snaps.forEach(({ sc, stack, stackIdx }) => { if (scenes.includes(sc)) { sc.stack = [...stack]; sc.stackIdx = stackIdx; } });
  renderStack();
}

// iOS requires a user-gesture to unlock the Web Audio context.
// Attach once; after first touch the browser allows audio.playback().
let _audioUnlocked = false;
function _unlockIosAudio() {

  } catch {}
}
if (!IS_ELECTRON) {

// ── IndexedDB ─────────────────────────────────────────────
function initDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('cue-music', 3);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (d.objectStoreNames.contains('audio'))         d.deleteObjectStore('audio');
      if (!d.objectStoreNames.contains('projects'))      d.createObjectStore('projects',      { keyPath: 'name' });
      if (!d.objectStoreNames.contains('ipad-projects')) d.createObjectStore('ipad-projects', { keyPath: 'name' });
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror   = () => rej(req.error);
    req.onblocked = () => rej(new Error('IndexedDB upgrade blocked by another tab'));
  });
}
function dbGet(store, key) {
  return new Promise((res, rej) => {
    const req = db.transaction(store,'readonly').objectStore(store).get(key);
    req.onsuccess = () => res(req.result); req.onerror = rej;
  });
}
function dbPut(store, value) {
  return new Promise((res, rej) => {
    // Resolve on commit: a quota error can abort the transaction after the request succeeded.
    const tx = db.transaction(store,'readwrite');
    tx.oncomplete = () => res();
    tx.onerror = tx.onabort = () => rej(tx.error);
    tx.objectStore(store).put(value);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const req = db.transaction(store,'readonly').objectStore(store).getAll();
    req.onsuccess = () => res(req.result); req.onerror = rej;
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store,'readwrite');
    tx.oncomplete = () => res();
    tx.onerror = tx.onabort = () => rej(tx.error);
    tx.objectStore(store).delete(key);
  });
}

// ── Audio helpers ─────────────────────────────────────────
// HTMLMediaElement.volume throws IndexSizeError outside [0,1], and a NaN from a
// bad project file would throw on every fade tick — always go through clamp01.
function clamp01(v) {
  v = Number(v);
  return Number.isFinite(v) ? Math.min(1, Math.max(0, v)) : 0;
}

// Stop and fully release a pad's audio element and its blob URL.
function releaseAudio(pad) {
  const audio = pad.audio;
  pad.audio = null;
  if (audio) {
    try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch {}
  }
  if (pad.audioUrl) { URL.revokeObjectURL(pad.audioUrl); pad.audioUrl = null; }
}

// Native looping always wraps to 0:00, so hand looping to the 'ended' handler when an IN point is set.
function syncLoopFlag(pad) {
  if (pad.audio) pad.audio.loop = pad.loop && pad.inPoint === null;
}

// ── Waveform ──────────────────────────────────────────────
// Peaks are computed once per loaded file, in a single queue (one decode at a time keeps memory flat), by decoding at a
// very low sample rate (8 kHz is plenty for an overview). Skipped for big files and on touch devices.
const WAVE_BUCKETS = 300, WAVE_H = 36, WAVE_MAX_BYTES = 40 * 1024 * 1024, WAVE_MAX_SECONDS = 20 * 60;
let peaksQueue = Promise.resolve();

async function computePeaks(file) {
  if (file.size > WAVE_MAX_BYTES) return null;
  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!AC) return null;
  let ctx;
  try { ctx = new AC(1, 1, 8000); } catch { ctx = new AC(1, 1, 22050); }        // some browsers refuse very low rates
  const buf = await ctx.decodeAudioData(await file.arrayBuffer());
  if (buf.duration > WAVE_MAX_SECONDS) return null;
  const peaks = new Float32Array(WAVE_BUCKETS), step = Math.max(1, Math.floor(buf.length / WAVE_BUCKETS));
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let b = 0; b < WAVE_BUCKETS; b++) {
      let m = peaks[b];
      const end = b === WAVE_BUCKETS - 1 ? d.length : Math.min(d.length, (b + 1) * step);
      for (let i = b * step; i < end; i++) { const v = d[i] < 0 ? -d[i] : d[i]; if (v > m) m = v; }
      peaks[b] = m;
    }
  }
  const top = peaks.reduce((m, v) => v > m ? v : m, 0);
  if (top > 0) for (let b = 0; b < WAVE_BUCKETS; b++) peaks[b] /= top;           // normalise so quiet files are readable too
  return peaks;
}

function queuePeaks(pad) {
  if (!prefs.waveform || IS_TOUCH || !pad.file || !pad.audio) return;
  const file = pad.file;
  pad.peaks = null;
  peaksQueue = peaksQueue.then(async () => {
    if (pad.file !== file || !prefs.waveform) return;                            // replaced / switched off while queued
    let peaks = null;
    try { peaks = await computePeaks(file); } catch { /* undecodable: the pad simply shows no waveform */ }
    if (pad.file !== file || !prefs.waveform || !peaks) return;
    pad.peaks = peaks;
    if (pads[pad.id] === pad) refreshPad(pad.id);                                // switches the pad to its taller "has-wave" layout
  }).catch(() => {});
}

function drawWave(pad) {
  const cv = document.getElementById(`pwave${pad.id}`);
  if (!cv || !pad.peaks || pads[pad.id] !== pad) return;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  g.fillStyle = getComputedStyle(cv).color;
  for (let i = 0; i < pad.peaks.length; i++) {
    const h = Math.max(1, Math.round(pad.peaks[i] * (cv.height - 4)));
    g.fillRect(i, Math.round((cv.height - h) / 2), 1, h);
  }
}

// ── Audio output device ───────────────────────────────────
// setSinkId routes each <audio> to a chosen output (an audio interface, the PA feed…). Chromium / Electron only —
// Safari / iPad don't have it, so the control is simply hidden there. The choice is per machine (prefs.outputId).
const CAN_SET_SINK = typeof HTMLMediaElement !== 'undefined' && 'setSinkId' in HTMLMediaElement.prototype;
let outputProblem = '';   // set while the saved device can't be used — the app falls back to the default for this session only

async function applyOutputTo(audio) {
  if (!CAN_SET_SINK || !audio) return;
  const want = prefs.outputId || '';
  if (audio.sinkId === want) return;
  try { await audio.setSinkId(want); outputProblem = ''; }
  catch (e) {
    // Keep the saved choice (the interface may just be unplugged) but tell the operator loudly: sound is now on the default device.
    outputProblem = want ? `Output device not available (${e.name}) — playing on the system default` : '';
    if (outputProblem) setStatus('⚠ ' + outputProblem);
  }
}
async function setOutputDevice(id) {
  prefs.outputId = id || '';
  savePrefs();
  outputProblem = '';
  await Promise.all(pads.map(p => applyOutputTo(p.audio)));
  setStatus(outputProblem ? '⚠ ' + outputProblem : (prefs.outputId ? 'Audio output changed' : 'Audio output: system default'));
}
async function listOutputDevices() {
