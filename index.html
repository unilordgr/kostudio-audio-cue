// ── MIDI ──────────────────────────────────────────────────
// Web MIDI: Chromium / Electron only (Safari / iPad have none). A controller maps to the same playback commands
// as the remote API. Mappings are per machine (prefs), because they describe *this* controller.
const CAN_MIDI = typeof navigator !== 'undefined' && typeof navigator.requestMIDIAccess === 'function';
let midiAccess = null, midiLearn = null;
const midiLast = {};                       // last CC value per control, so a knob/fader only fires when it crosses 64 upwards
const NOTE_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const noteName = n => `${NOTE_NAMES[n % 12]}${Math.floor(n / 12) - 1}`;

function sanitizeMidiMap(list) {
  if (!Array.isArray(list)) return [];
  return list.slice(0, 256).map(e => {
    const cmd = normalizeRemoteCommand(e?.cmd);
    if (!cmd || (e.msg !== 'note' && e.msg !== 'cc') || !Number.isInteger(e.num) || e.num < 0 || e.num > 127 || !Number.isInteger(e.ch) || e.ch < -1 || e.ch > 15) return null;
    return { msg: e.msg, ch: e.ch, num: e.num, cmd };
  }).filter(Boolean);
}
function midiCmdLabel(c) {
  return c.type === 'pad_toggle' ? (pads[c.id]?.name ? `Pad ${c.id + 1} — ${pads[c.id].name}` : `Pad ${c.id + 1}`) :
         c.type === 'stop_all' ? 'STOP ALL (instant)' : c.type === 'stop_all_auto' ? 'STOP ALL (follows STOP FADE)' :
         c.type === 'cue_play' ? 'Play / stop selected cue' : c.type === 'cue_next' ? 'Next cue' : c.type;
}
async function enableMidi() {
  if (!CAN_MIDI) return false;
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
  } catch {
    prefs.midiEnabled = false; savePrefs();
    setStatus('MIDI access was denied');
    return false;
  }
  bindMidiInputs();
  midiAccess.onstatechange = () => { bindMidiInputs(); if (!document.getElementById('modalOverlay').classList.contains('hidden') && document.getElementById('set-midi')) renderSettings(); };
  return true;
}
function disableMidi() {
  if (midiAccess) { for (const i of midiAccess.inputs.values()) i.onmidimessage = null; midiAccess.onstatechange = null; }
  midiAccess = null; midiLearn = null;
}
function bindMidiInputs() { if (midiAccess) for (const input of midiAccess.inputs.values()) input.onmidimessage = onMidiMessage; }

function onMidiMessage(ev) {
  const [status, d1, d2] = ev.data || [];
  const kind = status & 0xF0, ch = status & 0x0F;
  let msg = null;
  if (kind === 0x90 && d2 > 0) msg = { msg: 'note', ch, num: d1 };                                   // note on (velocity 0 = note off)
  else if (kind === 0xB0) {                                                                          // CC: fire once when it crosses 64 upwards
    const key = `${ch}:${d1}`, prev = midiLast[key] ?? 0;
    midiLast[key] = d2;
    if (d2 >= 64 && prev < 64) msg = { msg: 'cc', ch, num: d1 };
  }
  if (!msg || !Number.isInteger(msg.num)) return;
  if (midiLearn) { assignMidi(msg); return; }
  for (const e of prefs.midiMap) if (e.msg === msg.msg && e.num === msg.num && (e.ch === -1 || e.ch === msg.ch)) handleRemoteCommand(e.cmd);
}
function assignMidi(trigger, cmd = midiLearn, ch = trigger.ch) {
  const c = normalizeRemoteCommand(cmd);
  if (!c) return;
  prefs.midiMap = prefs.midiMap.filter(e => !(e.msg === trigger.msg && e.num === trigger.num && e.ch === ch));   // one action per control
  prefs.midiMap.push({ msg: trigger.msg, ch, num: trigger.num, cmd: c });
  prefs.midiMap = prefs.midiMap.slice(-256);
  savePrefs();
  midiLearn = null;
  setStatus(`MIDI: ${trigger.msg === 'note' ? noteName(trigger.num) : 'CC ' + trigger.num} → ${midiCmdLabel(c)}`);
  if (document.getElementById('set-midi')) renderSettings();
}
async function setMidiEnabled(on) {
  prefs.midiEnabled = !!on; savePrefs();
  if (on) { if (!(await enableMidi())) { prefs.midiEnabled = false; savePrefs(); } } else disableMidi();
  renderSettings();
}
function startMidiLearn() {
  const sel = document.getElementById('midiAction');
  let cmd = null; try { cmd = JSON.parse(sel.value); } catch {}
  if (!normalizeRemoteCommand(cmd)) return;
  midiLearn = cmd;
  setStatus('MIDI learn: press a key / pad / button on your controller now…');
  renderSettings();
}
function cancelMidiLearn() { midiLearn = null; renderSettings(); }
function removeMidiMapping(i) { prefs.midiMap.splice(i, 1); savePrefs(); renderSettings(); }
function mapDrumNotes() {   // General MIDI drum-pad layout: notes 36–47 → pads 1–12, any channel
  for (let i = 0; i < 12 && i < pads.length; i++) assignMidi({ msg: 'note', num: 36 + i }, { type: 'pad_toggle', id: i }, -1);
}

SETTINGS_SECTIONS.push({
  id: 'midi', title: 'MIDI controller',
  html: () => {
    if (!CAN_MIDI) return '<div class="set-row"><span><small>MIDI isn\'t available in this browser (Safari / iPad have no Web MIDI). Use Chrome, Edge or the desktop app.</small></span></div>';
    const inputs = midiAccess ? [...midiAccess.inputs.values()] : [];
    const actions = [
      ...pads.filter(p => p.audio).map(p => ({ type: 'pad_toggle', id: p.id })),
      { type: 'stop_all' }, { type: 'stop_all_auto' }, { type: 'cue_play' }, { type: 'cue_next' },
    ];
    return `<label class="set-row"><span>Use MIDI controllers<br><small>Map any note / pad / button to pads, STOP ALL and the cue stack. Saved for this computer only.</small></span>
        <input type="checkbox" id="midiEnabled" ${prefs.midiEnabled ? 'checked' : ''} onchange="setMidiEnabled(this.checked)"></label>
      ${prefs.midiEnabled ? `
        <div class="set-row"><small>${inputs.length ? 'Connected: ' + inputs.map(i => escHtml(i.name || 'MIDI input')).join(', ') : 'No MIDI controller detected — plug one in.'}</small></div>
        <div class="set-row"><select class="sh-select" id="midiAction" style="flex:1" ${midiLearn ? 'disabled' : ''}>
          ${actions.map(a => `<option value='${escHtml(JSON.stringify(a))}'>${escHtml(midiCmdLabel(a))}</option>`).join('')}</select>
          ${midiLearn ? `<button class="modal-btn primary" id="midiLearnBtn" onclick="cancelMidiLearn()">Waiting for a control… (cancel)</button>`
                      : `<button class="modal-btn" id="midiLearnBtn" onclick="startMidiLearn()">Learn</button>`}</div>
        ${prefs.midiMap.length ? `<div class="midi-map">${prefs.midiMap.map((e, i) => `
          <div class="set-row"><span>${e.msg === 'note' ? `Note ${e.num} (${noteName(e.num)})` : `CC ${e.num}`}${e.ch >= 0 ? ` · ch ${e.ch + 1}` : ' · any channel'} → <b>${escHtml(midiCmdLabel(e.cmd))}</b></span>
            <button class="modal-btn" onclick="removeMidiMapping(${i})">✕</button></div>`).join('')}</div>` : '<div class="set-row"><small>No controls mapped yet.</small></div>'}
        <div class="set-row"><button class="modal-btn" onclick="mapDrumNotes()">Map notes 36–47 to pads 1–12</button></div>` : ''}`;
  },
});

// ── Shortcuts manager ─────────────────────────────────────
function showShortcutsModal() {
  openModal('SHORTCUTS', '', `<button class="modal-btn" onclick="closeModal()">Close</button>`);
  renderShortcutsModal();
}

function renderShortcutsModal() {
  const padRows = pads.map(p => `
    <div class="sh-pad-row">
      <div class="sh-key${capturing === p.id ? ' capturing' : ''}"
           onclick="capturePadKeyFromModal(${p.id})"
           id="sh-pad-key-${p.id}">${capturing === p.id ? '…' : escHtml(p.key.toUpperCase())}</div>
      <div class="sh-pad-name${p.file ? '' : ' empty'}"${p.file ? ' data-notr' : ''}>${p.file ? escHtml(p.name) : 'empty'}</div>
    </div>`).join('');

  const customRows = customShortcuts.length
    ? customShortcuts.map(s => {
        const pad = pads[s.padId];
        const lbl = pad?.file ? escHtml(pad.name) : `Pad ${s.padId + 1}`;
        return `<div class="sh-custom-row">
          <div class="sh-key combo">${escHtml(s.combo)}</div>
          <div class="sh-pad-name">${lbl}</div>
          <div class="sh-actions">
            <button class="sh-test" onclick="togglePadCrossfade(${s.padId})" title="Play/Stop">▶</button>
            <button class="sh-del"  onclick="removeCustomShortcut(${s.id})" title="Delete">×</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="sh-empty-msg">No custom hotkeys added yet.</div>';

  const padOptions = pads.map(p => `<option value="${p.id}">${p.file ? escHtml(p.name) : `Pad ${p.id + 1} (empty)`}</option>`).join('');

  document.getElementById('modalBody').innerHTML = `
    <div class="sh-sec-hdr">Pad Shortcuts <span class="sh-hint">— click a key badge to remap</span></div>
    <div class="sh-pad-grid">${padRows}</div>
    <div class="sh-sec-hdr" style="margin-top:16px">Custom Hotkeys
      <span class="sh-hint">— Ctrl / Alt / Shift + key, F1–F12, etc.</span>
    </div>
    <div class="sh-custom-list" id="sh-custom-list">${customRows}</div>
    <div class="sh-add-form" id="sh-add-form" style="display:none">
      <div class="sh-add-row">
        <span class="sh-add-label">Key</span>
        <div class="sh-key capturing" id="captureComboBtn" onclick="startHotkeyCapture()" style="cursor:pointer">Press key…</div>
      </div>
      <div class="sh-add-row">
        <span class="sh-add-label">Sound</span>
        <select class="sh-select" id="sh-pad-select">${padOptions}</select>
      </div>
      <div class="sh-form-btns">
        <button class="modal-btn" onclick="cancelHotkeyCapture()">Cancel</button>
        <button class="modal-btn primary" onclick="confirmAddHotkey()">+ Add</button>
      </div>
    </div>
    <button class="sh-add-btn" id="sh-add-btn" onclick="showAddHotkeyForm()">+ Add Hotkey</button>
  `;
}

function capturePadKeyFromModal(padId) {
  if (lockedOut()) return;
  if (capturing !== null && capturing !== padId) endCapture(capturing);
  capturing = padId;
  const badge = document.getElementById(`sh-pad-key-${padId}`);
  if (badge) { badge.textContent = '…'; badge.classList.add('capturing'); }
  setStatus('Press any key to assign — Esc to cancel');
}

function showAddHotkeyForm() {
  if (lockedOut()) return;
  pendingCombo = null; capturingHotkey = false;
  document.getElementById('sh-add-form').style.display = 'flex';
  document.getElementById('sh-add-btn').style.display  = 'none';
  startHotkeyCapture();
}
function startHotkeyCapture() {
  capturingHotkey = true; pendingCombo = null;
  const btn = document.getElementById('captureComboBtn');
  if (btn) { btn.textContent = '…'; btn.classList.add('capturing'); }
  setStatus('Press any key combination — Esc to cancel');
}
function cancelHotkeyCapture() {
  capturingHotkey = false; pendingCombo = null;
  document.getElementById('sh-add-form').style.display = 'none';
  document.getElementById('sh-add-btn').style.display  = '';
  setStatus('');
}
function confirmAddHotkey() {
  if (lockedOut()) return;
  if (!pendingCombo) { setStatus('Press a key first'); return; }
  const padId = parseInt(document.getElementById('sh-pad-select').value, 10);
  if (customShortcuts.find(s => s.combo === pendingCombo)) { setStatus(`"${pendingCombo}" is already assigned`); return; }
  if (pendingCombo === 'Space') { setStatus('SPACE is reserved for Next Cue'); return; }
  if (pads.some(p => p.key && p.key === pendingCombo.toLowerCase())) {   // custom hotkeys are checked first, so this would silently shadow the pad key
    setStatus(`"${pendingCombo}" is already a pad shortcut — remap that pad first`);
    return;
  }
  customShortcuts.push({ id: shortcutIdSeq++, combo: pendingCombo, padId });
  pendingCombo = null; capturingHotkey = false;
  renderShortcutsModal();
  setStatus(`Hotkey "${customShortcuts[customShortcuts.length - 1].combo}" added`);
}
function removeCustomShortcut(id) {
  if (lockedOut()) return;
  customShortcuts = customShortcuts.filter(s => s.id !== id);
  renderShortcutsModal();
}

// ── Helpers ───────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// For a value placed inside a single-quoted JS string inside a double-quoted HTML attribute,
// e.g. onclick="fn('${escAttr(x)}')". Escape for the JS string first (backslash, quote, newline),
// then for the HTML attribute (& < > ") — the attribute is decoded before the JS is parsed.
function escAttr(s) {
  return String(s)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,'\\n')
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function stripExt(name) { return name.replace(/\.[^/.]+$/, ''); }
function setStatus(msg) { const el = document.getElementById('statusTxt'); if (el) el.textContent = msg; }

// ── UI Scale ──────────────────────────────────────────────
function adjustPadsScale(delta) {
  padsScale = Math.min(2.0, Math.max(0.4, Math.round((padsScale + delta) * 100) / 100));
  applyScales();
  scheduleAutosave();
}
function adjustStackScale(delta) {
  stackScale = Math.min(1.6, Math.max(0.7, Math.round((stackScale + delta) * 10) / 10));
  applyScales();
  scheduleAutosave();
}
function applyScales() {
  document.documentElement.style.setProperty('--pads-scale', padsScale);
  document.documentElement.style.setProperty('--stack-text-scale', stackScale);
  const pe = document.getElementById('padsScaleVal');
  if (pe) pe.textContent = Math.round(padsScale * 100) + '%';
  const se = document.getElementById('stackScaleVal');
  if (se) se.textContent = Math.round(stackScale * 100) + '%';
  updateGridWidth();
}

function updateGridWidth() {
  const section = document.querySelector('.pads-section');
  const grid    = document.getElementById('padsGrid');
  if (!section || !grid) return;
  // Reset to natural width first so clientWidth reads the true available space
  grid.style.width = '';
  // section.clientWidth includes its padding (14px each side = 28px total)
  const availW = section.clientWidth - 28;
  // Set CSS width so that after zoom: css_width × padsScale = availW
  grid.style.width = Math.floor(availW / padsScale) + 'px';
}

// ── Autosave ──────────────────────────────────────────────
function scheduleAutosave() {
  clearTimeout(asTimer);
  asTimer = setTimeout(saveAutosave, 1500);
}
function saveAutosave() {
  const data = {
    savedAt: Date.now(),
    masterVol, autoAdv, fadeDuration, padsScale, stackScale,
    scenes: scenes.map(s => ({ id: s.id, name: s.name, stack: s.stack.map(i => i.padId), stackIdx: s.stackIdx })),
    currentSceneIdx,
    customShortcuts,
    pads: pads.map(p => ({ id: p.id, key: p.key, name: p.name, loop: p.loop, vol: p.vol, fadeEnabled: p.fadeEnabled, color: p.color, hasAudio: !!p.file, audioPath: p.filePath || p.missingPath || null, inPoint: p.inPoint ?? null, outPoint: p.outPoint ?? null })),
  };
  try { localStorage.setItem('cue-autosave', JSON.stringify(data)); } catch {}
}
function checkAutosave() {
  let data;
  try { data = JSON.parse(localStorage.getItem('cue-autosave')); } catch {}
  if (!data) return;
  showRestoreDialog(data);
}
function showRestoreDialog(data) {
  const ago = fmtAgo(Date.now() - data.savedAt);
  const padsWithAudio = (data.pads || []).filter(p => p.hasAudio).length;
  openModal('RESTORE SESSION?',
    `<div style="line-height:1.7;font-size:13px">
      <p>An unsaved session was found from ${ago}.</p>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">${padsWithAudio} loaded sound(s) — names, settings, scenes and stack order will be restored.</p>
      <p style="font-size:12px;color:var(--muted);margin-top:4px">Audio files cannot be recovered; pads that had audio will show a ⚠ warning — drop the files back onto them.</p>
    </div>`,
    `<button class="modal-btn" onclick="localStorage.removeItem('cue-autosave');closeModal()">Discard</button>
     <button class="modal-btn primary" onclick="restoreSessionData(JSON.parse(localStorage.getItem('cue-autosave')));localStorage.removeItem('cue-autosave');closeModal()">Restore</button>`
  );
}
function restoreSessionData(data) {
  let parsed;
  try { parsed = parseProjectConfig(data); }
  catch (e) { setStatus(`Could not restore the saved session — ${e.message}`); return; }
  // Keep the on-disk link of pads whose audio can't be recovered, so a later Save As doesn't drop it
  if (IS_ELECTRON) {
    data.pads.forEach((pc, i) => { if (typeof pc?.audioPath === 'string') parsed.pads[i].missingPath = pc.audioPath; });
  }
  commitProject(parsed);
  // Write permission for a project path only lasts for the session it was chosen in, so the first
  // Save after a restore goes through Save As (and can't overwrite the original with missing-audio links).
  currentSavePath = null;
  setStatus('Session restored — re-drop any audio files shown with ⚠');
}
function fmtAgo(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  return `${Math.floor(m / 60)}h ago`;   // (all three are dictionary keys: {0}s ago / {0}m ago / {0}h ago)
}

// ── In-app update progress ────────────────────────────────
if (typeof window !== 'undefined' && window.electronAPI?.onUpdateProgress) {
  window.electronAPI.onUpdateProgress(({ percent, label }) => {
    const banner = document.getElementById('updateBanner');
    const lbl    = document.getElementById('updLabel');
    const bar    = document.getElementById('updBar');
    const pct    = document.getElementById('updPct');
    banner.classList.remove('upd-success');
    banner.classList.add('visible');
    if (lbl) lbl.textContent = label || 'Downloading update…';
    if (bar) bar.style.width = (percent >= 0 ? percent : 30) + '%';
    if (pct) pct.textContent = percent >= 0 ? percent + '%' : '';
    // Indeterminate animation when percent unknown
    if (percent < 0 && bar) bar.style.transition = 'none';
  });

  window.electronAPI.onUpdateReady(({ message }) => {
    const banner = document.getElementById('updateBanner');
    const lbl    = document.getElementById('updLabel');
    const bar    = document.getElementById('updBar');
    const pct    = document.getElementById('updPct');
    banner.classList.add('visible', 'upd-success');
    if (lbl) lbl.textContent = message || 'Update ready!';
    if (bar) bar.style.width = '100%';
    if (pct) pct.textContent = '✓';
  });

  window.electronAPI.onUpdateError(({ message }) => {
    const banner = document.getElementById('updateBanner');
    const lbl    = document.getElementById('updLabel');
    const bar    = document.getElementById('updBar');
    banner.classList.add('visible');
    if (lbl) lbl.textContent = '⚠ ' + (message || 'Update failed');
    if (bar) bar.style.width = '0%';
    setStatus('Update error: ' + (message || 'unknown'));
  });
}

// ── Theme ─────────────────────────────────────────────────
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('cue-theme'); } catch {}
  applyTheme(saved || 'light');
}
function toggleTheme() { applyTheme((document.documentElement.dataset.theme || 'dark') === 'dark' ? 'light' : 'dark'); }
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('cue-theme', theme); } catch {}
  if (typeof pads !== 'undefined') pads.forEach(drawWave);
}

// ── Touch / iPad ──────────────────────────────────────────
const STACK_H_EXPANDED  = 310;
const STACK_H_COLLAPSED = 100;   // handle + side-by-side Play/Next buttons
let   stackSheetOpen    = true;

function initTouchLayout() {
  if (!IS_TOUCH) return;
  document.documentElement.style.setProperty('--stack-sheet-h', STACK_H_EXPANDED + 'px');
}

function toggleStackDrawer() {
  if (!IS_TOUCH) return;
  stackSheetOpen = !stackSheetOpen;
  const h = stackSheetOpen ? STACK_H_EXPANDED : STACK_H_COLLAPSED;
  document.documentElement.style.setProperty('--stack-sheet-h', h + 'px');
  const panel = document.getElementById('stackPanel');
  if (panel) panel.classList.toggle('collapsed', !stackSheetOpen);
}

// ── iPad / Safari Save & Load (no File System Access API) ─

async function showIdbSaveModal() {
  const defaultName = `Show ${new Date().toLocaleDateString('en-GB')}`;
  openModal('SAVE PROJECT',
    `<label class="modal-label">Project name</label>
     <input class="modal-input" id="saveNameInput" type="text" value="${escHtml(defaultName)}" placeholder="My Show" autocorrect="off">
     <p style="margin-top:11px;font-size:11px;color:var(--muted);line-height:1.8">
       Saves to this device's browser storage.<br>
       Tap Export in the Load screen to back up or transfer to another device.
     </p>`,
    `<button class="modal-btn" onclick="closeModal()">Cancel</button>
     <button class="modal-btn save-ok" onclick="doSaveProjectIDB(document.getElementById('saveNameInput').value)">💾 Save to Device</button>`
  );
  requestAnimationFrame(() => { const inp = document.getElementById('saveNameInput'); if (inp) { inp.focus(); inp.select(); } });
}

async function doSaveProjectIDB(name) {
  name = name.trim();
  if (!name) return;
  // The store is keyed by name — saving over an existing project replaces it and all its audio
  let existing = null;
  try { existing = await dbGet('ipad-projects', name); } catch {}
  if (existing && !confirm(`A project named "${name}" already exists on this device.\n\nReplace it?`)) return;
  setStatus('Saving…');
  closeModal();

  // Capture audio as ArrayBuffers while we still hold File references
  const audioData = {};
  for (const p of pads) {
    if (p.file) {
      try {
        const buf = await p.file.arrayBuffer();
        audioData[p.id] = { name: p.file.name, type: p.file.type, buf };
      } catch (e) {
        // Never save a project with silently missing audio over a good copy
        console.warn('Could not read audio for pad', p.id, e);
        setStatus(`Save cancelled — could not read the audio for "${p.name}"`);
        return;
      }
    }
  }

  const config = {
    name, version: 4, savedAt: Date.now(),
    masterVol, autoAdv, fadeDuration, padsScale, stackScale,
    scenes: scenes.map(s => ({
      id: s.id, name: s.name,
      stack: s.stack.map(i => i.padId), stackIdx: s.stackIdx
    })),
    currentSceneIdx, customShortcuts,
    pads: pads.map(p => ({
      id: p.id, key: p.key, name: p.name, loop: p.loop, vol: p.vol,
      fadeEnabled: p.fadeEnabled, color: p.color,
      inPoint: p.inPoint ?? null, outPoint: p.outPoint ?? null
    }))
  };

  try {
    await dbPut('ipad-projects', { name, config, audioData, savedAt: Date.now() });
    localStorage.removeItem('cue-autosave');
    setStatus(`"${name}" saved — ${Object.keys(audioData).length} audio file(s)`);
  } catch (e) {
    setStatus('Save failed: ' + e.message);
  }
}

async function showIdbLoadModal() {
  const closeBtn = '<button class="modal-btn" onclick="closeModal()">Close</button>';
  openModal('LOAD PROJECT', '<div style="color:var(--muted);font-size:12px;text-align:center;padding:20px">Loading…</div>', closeBtn);
  let projects;
  try { projects = await dbGetAll('ipad-projects'); }
  catch {
    document.getElementById('modalBody').innerHTML = '<div class="proj-empty">Browser storage is unavailable.<br>(Private browsing blocks it.)</div>';
    return;
  }
  projects.sort((a, b) => b.savedAt - a.savedAt);

  const bodyHTML = projects.length
    ? `<div class="proj-list">${projects.map(p => `
        <div class="proj-item" onclick="loadProjectIDB('${escAttr(p.name)}')">
          <div class="proj-meta">
            <div class="proj-name" data-notr>${escHtml(p.name)}</div>
            <div class="proj-date">${new Date(p.savedAt).toLocaleString()}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="modal-btn" style="padding:4px 10px;font-size:11px;white-space:nowrap"
              onclick="event.stopPropagation();exportProjectIDB('${escAttr(p.name)}')">Export…</button>
            <button class="proj-del" title="Delete" onclick="event.stopPropagation();deleteIdbProject('${escAttr(p.name)}')">×</button>
          </div>
        </div>`).join('')}</div>`
    : `<div class="proj-empty">No saved projects.<br>Use Save to save your first project.</div>`;

  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modalFtr').innerHTML =
    `<button class="modal-btn" onclick="importProjectFile()">📥 Import .cuepro…</button>
     <button class="modal-btn" onclick="closeModal()">Close</button>`;
}

async function loadProjectIDB(name) {
  if (projectLoading) return;
  const entry = await dbGet('ipad-projects', name);
  if (!entry) { setStatus('Project not found'); return; }

  const { config, audioData } = entry;
  let parsed;
  try { parsed = parseProjectConfig(config); }
  catch (e) { setStatus(`Cannot load "${name}" — ${e.message}`); return; }

  projectLoading = true;
  try {
    // Restore audio from stored ArrayBuffers into the not-yet-live pads
    for (const [idStr, ad] of Object.entries(audioData || {})) {
      const pad = parsed.pads[+idStr];
      if (!pad || !ad?.buf) continue;
      try {
        attachAudio(pad, new File([ad.buf], String(ad.name || 'audio'), { type: String(ad.type || '') }));
      } catch (e) { console.warn('Could not restore audio for pad', idStr, e); }
    }
    commitProject(parsed);
    localStorage.removeItem('cue-autosave');
    closeModal();
    setStatus(`"${config.name ?? name}" loaded — ${pads.filter(p => p.file).length} sound(s) ready`);
  } finally { projectLoading = false; }
}

async function deleteIdbProject(name) {
  if (lockedOut()) return;
  if (!confirm(`Delete "${name}" and its audio from this device?\n\nThis cannot be undone — Export it first if you want a backup.`)) return;
  await dbDelete('ipad-projects', name);
  showIdbLoadModal();
}

// Export project as a self-contained .cuepro file (audio encoded as base64)
async function exportProjectIDB(name) {
  const entry = await dbGet('ipad-projects', name);
  if (!entry) return;
  setStatus('Exporting…');

  const audioExport = {};
  for (const [id, ad] of Object.entries(entry.audioData || {})) {
    try {
      const bytes = new Uint8Array(ad.buf);
      let b64 = '';
      const chunk = 8192;
      for (let i = 0; i < bytes.length; i += chunk) {
        b64 += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      audioExport[id] = { name: ad.name, type: ad.type, b64: btoa(b64) };
    } catch (e) { console.warn('Export audio failed pad', id, e); }
  }

  const blob = new Blob(
    [JSON.stringify({ ...entry, audioData: audioExport })],
    { type: 'application/json' }
  );
  const url = URL.createObjectURL(blob);
  const a   = Object.assign(document.createElement('a'), {
    href: url, download: sanitizeFilename(name) + '.cuepro'
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  closeModal();
  setStatus(`"${name}" exported as .cuepro`);
}

// Import a .cuepro file exported from this app
function importProjectFile() {
  if (lockedOut()) return;
  const inp = Object.assign(document.createElement('input'), {
    type: 'file', accept: '.cuepro,application/json'
  });
  inp.onchange = async () => {
    const file = inp.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || typeof data !== 'object') throw new Error('not a project file');
      // Fail with a readable reason before anything is stored (parseProjectConfig is pure)
      parseProjectConfig(data.config || data);
      const projectName = String(data.config?.name || data.name || 'Imported Project').slice(0, 100);
      let existing = null;
      try { existing = await dbGet('ipad-projects', projectName); } catch {}
      if (existing && !confirm(`A project named "${projectName}" already exists on this device.\n\nReplace it with the imported one?`)) return;

      // Decode base64 audio back to ArrayBuffer
      const audioData = {};
      for (const [id, ad] of Object.entries(data.audioData || {})) {
        try {
          if (ad.b64) {
            const binary = atob(ad.b64);
            const buf    = new ArrayBuffer(binary.length);
            const view   = new Uint8Array(buf);
            for (let i = 0; i < binary.length; i++) view[i] = binary.charCodeAt(i);
            audioData[id] = { name: ad.name, type: ad.type, buf };
          } else if (ad.buf) {
            audioData[id] = ad;   // already an ArrayBuffer (same-device copy)
          }
        } catch (e) { console.warn('Could not import audio for pad', id, e); }
      }

      // Ensure config.name is set
      if (!data.config) data.config = { ...data, audioData: undefined };
      data.config.name = projectName;

      await dbPut('ipad-projects', { ...data, audioData, name: projectName, savedAt: Date.now() });
      await loadProjectIDB(projectName);
    } catch (e) { setStatus('Import failed: ' + e.message); }
  };
  inp.click();
}
