name: Build Windows & Mac

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows portable .exe
        run: npm run dist-win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          retention-days: 7

  build-mac:
    runs-on: macos-14   # Sonoma / Apple Silicon — avoids macOS 15 hdiutil bug

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Mac DMG
        # macOS 15 (Sequoia) has a race in hdiutil detach that exits non-zero
        # even after the DMG is fully written. We use macos-14 to avoid this,
        # but also add a fallback: if electron-builder exits non-zero yet the
        # .dmg files exist on disk, we treat the build as successful.
        run: |
          npm run dist-mac || {
            # Both architectures must exist: the README links to both, and the in-app updater
            # picks the DMG matching the user's CPU.
            if [ -f dist/Kostudio-Audio-Cue-arm64.dmg ] && [ -f dist/Kostudio-Audio-Cue-x64.dmg ]; then
              echo "Both DMGs created — hdiutil detach error was the only issue, continuing."
            else
              echo "Mac build actually failed — expected arm64 and x64 DMGs, found:"
              ls dist || true
              exit 1
            fi
          }

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist/*.dmg
          retention-days: 7

  publish-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    # Two quick pushes must not race on delete + create of the same release
    concurrency:
      group: publish-release
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files

      - name: Download Mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: release-files

      - name: Copy iPad web app to release files
        run: cp index.html "release-files/Kostudio-Audio-Cue-iPad-Web.html"

      - name: Write release notes
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          {
            echo "## What's new in ${TAG}"
            echo
            cat RELEASE_NOTES.md
            echo
            echo "---"
            echo
            echo "- **Windows:** download the .exe — portable, no install required."
            echo "- **Mac:** download the .dmg for your chip, drag the app to Applications, then run \`xattr -cr \"/Applications/Kostudio Audio Cue.app\"\` once in Terminal (the app is unsigned)."
            echo "- **iPad / Browser:** download \`Kostudio-Audio-Cue-iPad-Web.html\`, open it in Safari and Add to Home Screen — or use the GitHub Pages site."
          } > /tmp/release-notes.md

      - name: Publish versioned release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag --repo ${{ github.repository }} 2>/dev/null || true
          gh release create "$TAG" release-files/* \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }} \
            --title "Kostudio Audio Cue ${TAG}" \
            --notes-file /tmp/release-notes.md
