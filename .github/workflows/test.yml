name: Tests

# Runs on every pull request (the build workflow only runs on main), and on main for a signal
# after merge. The suite needs no Electron binary: main.js is tested with `electron` mocked, and
# index.html is driven in a real Chromium via Playwright.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: skips Electron's postinstall (a ~100 MB binary download the tests don't use)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
