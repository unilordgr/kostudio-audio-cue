name: Tests

# Runs on every pull request (the build workflow only runs on main), and on main for a signal
# after merge. The suite drives index.html in a real Chromium via Playwright, tests main.js / remote.js
# with `electron` mocked, AND launches the real Electron app (headless, under xvfb) — first from source,
# then the packaged Linux build, which proves electron-builder put every file the app needs into it.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts, then the Electron binary explicitly (the same download its postinstall would do)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests (including the real Electron app)
        run: xvfb-run -a npm test

      - name: Package the app (Linux, unpacked) and smoke-test the packaged build
        run: |
          npx electron-builder --linux --dir --publish never
          KCUE_APP_BIN=dist/linux-unpacked/kostudio-audio-cue xvfb-run -a node tests/electron.test.js
